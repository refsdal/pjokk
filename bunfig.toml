[install]
# Bun defaults to the "isolated" linker once a `workspaces` field exists,
# which only symlinks a workspace member into the root node_modules when
# some package.json lists it as a dependency. Nothing does yet (src/server
# and src/web still live under the root package and aren't listed as
# workspace deps), so without this, `bun install` silently skips linking
# node_modules/@pjokk/shared and every "@pjokk/shared" import breaks.
# "hoisted" restores the flat node_modules layout this repo already used
# before workspaces existed, which links all workspace packages by name.
linker = "hoisted"
