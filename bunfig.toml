[install]
# Every workspace now declares the third-party packages its own code imports
# (apps/frontend its runtime deps and build tooling, apps/landing react; the
# root only repo-wide tooling: biome, TypeScript, Playwright, types, and
# web-push for scripts/gen-vapid.mjs). The "hoisted" linker is kept anyway: it
# gives the flat node_modules the scripts and CI were built against, and bun's
# default "isolated" linker for workspaces is a separate change to make on its
# own — it would also start failing any import a package has not declared.
linker = "hoisted"
