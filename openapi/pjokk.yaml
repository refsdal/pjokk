      summary: >-
        Partial update. `endTime` sent as `null` CLEARS it, reopening the
        session — subject to the same one-running-session-per-baby
        constraint as create, so this can also 409. `notes` may also be
        sent as `null` to clear it; `type`/`startTime` are not nullable —
