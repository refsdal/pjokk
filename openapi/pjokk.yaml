  /api/timeline:
    get:
      operationId: listTimeline
      summary: >-
        The merged feed of everything, newest first. Sleep and play entries
        sort by their startTime (active sessions have endTime null); every
        other kind sorts by time. filter=other selects the eight non-core
        kinds (medicine, bath, note, milestone, measurement, pump, play,
        vaccine) together; omitting filter returns all eleven.
      tags: [timeline]
      parameters:
        - name: babyId
          in: query
          required: true
          schema:
            type: string
        - name: before
          in: query
          required: false
          description: >-
            Opaque keyset cursor from a previous page's nextCursor
            ("<epochMs>|<id>"). The id tiebreak keeps pagination lossless
            across equal timestamps.
          schema:
            type: string
            pattern: ^\d{1,15}\|.{1,64}$
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: filter
          in: query
          required: false
          schema:
            type: string
            enum: [feeds, diapers, sleep, other]
      responses:
        "200":
          description: Timeline page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timeline"
        "404":
          description: Unknown baby.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/me:
    get:
      operationId: getMe
      summary: >-
        Session info for the SPA shell. Requires a session but NOT an
        active family — the family/member/plan fields are null when the
        caller has none.
      tags: [me]
      responses:
        "200":
          description: The caller's session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"

components:
  parameters:
    babyIdQuery:
      name: babyId
      in: query
      description: Restrict the result to one baby in the caller's family.
      required: false
      schema:
        type: string
    limitQuery:
      name: limit
      in: query
      description: Maximum number of rows to return.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
    idPath:
      name: id
      in: path
      description: Resource id.
      required: true
      schema:
        type: string
    memberIdPath:
      name: memberId
      in: path
