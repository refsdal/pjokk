    TimelineEntry:
      type: object
      description: >-
        One row in the merged timeline. `kind`, `id`, `babyId`,
        `caretakerId`, `caretakerName` and `notes` are present on every
        entry regardless of kind; everything else is kind-specific and only
        present for the kinds that have it (e.g. `startTime`/`endTime` on
        sleep and play, `time` on the other nine, `documents` only on
        vaccine) — see internal/api/timeline.go's per-kind entry builders,
        ported field-for-field from apps/api/src/routes/timeline.ts's merge.
        Modeled as an open object (kind + a handful of always-present fields
        typed, everything else additionalProperties) rather than a oneOf
        discriminated union: oapi-codegen has no clean Go representation for
        eleven structurally different variants sharing one JSON shape.
      required: [kind, id, babyId, caretakerId, caretakerName, notes]
      properties:
        kind:
          type: string
          enum:
            - feed
            - diaper
            - sleep
            - medicine
            - bath
            - note
            - milestone
            - measurement
            - pump
            - play
            - vaccine
        id:
          type: string
        babyId:
          type: string
        caretakerId:
          type: string
        caretakerName:
          type: string
        notes:
          type: string
          nullable: true
      additionalProperties: true
    Timeline:
      type: object
      required: [entries, nextCursor]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/TimelineEntry"
        nextCursor:
          type: string
          nullable: true
          description: >-
            Opaque keyset cursor ("<epochMs>|<id>"); pass back as ?before=
            for the next (older) page. Null when there is no further page.
    Summary:
      type: object
      required:
        - lastFeed
        - lastDiaper
        - activeSleep
        - lastSleep
        - activePlay
        - today
      properties:
        lastFeed:
          allOf:
            - $ref: "#/components/schemas/FeedLog"
          nullable: true
        lastDiaper:
          allOf:
            - $ref: "#/components/schemas/DiaperLog"
          nullable: true
        activeSleep:
          allOf:
            - $ref: "#/components/schemas/SleepLog"
          nullable: true
        lastSleep:
          allOf:
            - $ref: "#/components/schemas/SleepLog"
          nullable: true
        activePlay:
          allOf:
            - $ref: "#/components/schemas/PlayLog"
          nullable: true
        today:
          type: object
          required: [feeds, intakeMl, solidsG, wet, dirty, both, sleepMin]
          properties:
            feeds:
              type: integer
              format: int32
            intakeMl:
              type: integer
              format: int32
            solidsG:
              type: integer
              format: int32
            wet:
              type: integer
              format: int32
