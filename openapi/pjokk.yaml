  /api/calendar/events:
    get:
      operationId: listCalendarEvents
      summary: >-
        Family-wide planned events starting in [from, to). Free (no plan
        gate — creation was premium in the TS predecessor; this port
        removes that gate, see internal/api/calendar.go).
      tags: [calendar]
      parameters:
        - name: from
          in: query
          required: true
          description: Inclusive range start, RFC3339 with an explicit offset.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: >-
            Exclusive range end. Must be after `from`, and the span must not
            exceed 366 days.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Events in [from, to), ascending by startTime.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarEvent"
        "400":
          description: to <= from, or the span exceeds 366 days.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createCalendarEvent
      summary: >-
        Create a family-wide (or baby-specific) event. babyIds/
        assigneeUserIds must belong to the caller's family — see
        internal/api/calendar.go's refsValid. Duplicate ids are deduped
        before insert.
      tags: [calendar]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCalendarEvent"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEvent"
        "400":
          description: Unknown baby or family member reference.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/calendar/events/{id}:
    patch:
      operationId: updateCalendarEvent
      summary: >-
        Partial update. `description`/`location`/`durationMin`/
        `remindMinutesBefore` may be sent as `null` to CLEAR that column;
        `title`/`category`/`startTime`/`allDay` are not nullable — only
        settable or omitted. An event that IS (or becomes, via this same
        PATCH) all-day always has durationMin cleared. Changing `startTime`
        or `remindMinutesBefore` re-arms the reminder sweep (clears
        remindedAt). `babyIds`/`assigneeUserIds`, when present, REPLACE the
        link set; omitted leaves it untouched.
      tags: [calendar]
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCalendarEvent"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEvent"
        "400":
          description: Unknown baby or family member reference.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No event with this id in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteCalendarEvent
      summary: Delete an event; its link rows cascade.
      tags: [calendar]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "404":
          description: No event with this id in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

