# Toolchain pin for Pjokk — the single source of truth for dev AND CI.
# `mise install` in the repo gives everyone the same Go + Bun plus the
# codegen tools `go generate` expects on PATH (sqlc, oapi-codegen, goose).
# CI installs from this same file via jdx/mise-action, but only `go bun`
# (install_args) — the codegen tools are compiled from source and CI never
# runs `go generate` (generated code is committed; a drift-guard test
# enforces it).
[tools]
go = "1.27.0"
bun = "1.4"
"go:github.com/sqlc-dev/sqlc/cmd/sqlc" = "1.31.1"
"go:github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen" = "2.8.0"
"go:github.com/pressly/goose/v3/cmd/goose" = "3.27.3"
