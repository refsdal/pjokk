name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint + typecheck
        run: pnpm check

      - name: Tests (workers runtime)
        run: pnpm test

      - name: Build
        run: pnpm build

  # Every green push to main auto-deploys the test environment
  # (test.pjokk.no, worker pjokk-test, isolated D1/KV/R2 + Stripe test
  # mode). Skips gracefully while the CLOUDFLARE_API_TOKEN repo secret is
  # not configured.
  deploy-test:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Apply D1 migrations (pjokk-test)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm db:migrate:test

      - name: Deploy test environment
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm deploy:test

      - name: Skipped (no CLOUDFLARE_API_TOKEN secret)
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN not set — test deploy skipped."
