name: CI

# The PR gate: "is this change good?" — the full suite (test.yml), then the
# image built once from native artifacts, smoke-tested, and pushed as a
# semver-prerelease preview. Pushes to main are release.yml's business:
# merging IS releasing.

on:
  pull_request:

permissions:
  contents: read

# A force-push to a PR obsoletes the running check — cancel it instead of
# letting it burn minutes to report on a commit nobody can merge.
concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  # The image has to build and RUN, not merely typecheck — and it is
  # published as a preview so the publish path is exercised on every change
  # rather than first tried during a release.
  #
  # Preview tags are semver prereleases of the release they precede
  # (0.2.0-pr.123 sorts below 0.2.0), so they can never be mistaken for a
  # release. release.yml is what produces bare version tags and `latest`.
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      # Full history and tags: svu computes the upcoming version from
      # Conventional Commits since the last v* tag, and a shallow clone has
      # neither.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "go bun aqua:caarlos0/svu"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('apps/server/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Install
        run: bun install --frozen-lockfile

      # What the next release WOULD be (same --v0 rule as release.yml), so
      # the preview tags sort below it as prereleases of it.
      - name: Compute version
        id: version
        run: |
          tag=$(svu next --v0)
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Everything the image COPYs, compiled natively — the Dockerfile
      # itself is COPY-only, so the buildx assemble below takes seconds and
      # nothing ever runs under QEMU.
      - name: Build artifacts (SPA + both server binaries)
        run: bash scripts/build-artifacts.sh

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # A pull request from a fork gets a read-only GITHUB_TOKEN, so pushing
      # would fail on something unrelated to the change. Build-only there.
      - name: Can this run push?
        id: gate
        run: |
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to the container registry
        if: steps.gate.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Plain single-arch build for the smoke test: the artifacts are
      # prebuilt, so this is a couple of COPYs. No layer cache needed — there
      # is nothing worth caching any more.
      - name: Build image
        run: docker build -t pjokk:ci .

      - name: Smoke-test the image
        run: |
          docker network create pjokk-ci
          docker run -d --name pg --network pjokk-ci \
            -e POSTGRES_USER=pjokk -e POSTGRES_PASSWORD=pjokk -e POSTGRES_DB=pjokk \
            postgres:17-alpine
          # -h 127.0.0.1 forces the probe over TCP. Without it pg_isready
          # checks the Unix socket, which already accepts during initdb's
          # socket-only first start — before the restart that opens TCP —
          # so the migrate one-off below could race a "ready" Postgres that
          # refused TCP connections.
          for i in $(seq 1 30); do
            docker exec pg pg_isready -h 127.0.0.1 -U pjokk -d pjokk && break
            sleep 1
          done

          # fs storage driver, not s3: it needs no MinIO container, and the
          # image already creates /data (owned by the unprivileged user) at
          # build time, so a bare `docker run` with no volume still works —
          # see docker-compose.yml's own default for the same reasoning.
          env_args=(
            -e DATABASE_URL=postgres://pjokk:pjokk@pg:5432/pjokk
            -e APP_URL=http://localhost:3000
            -e AUTH_SECRET=ci-smoke-test-secret-at-least-32-bytes-long
            -e STORAGE_DRIVER=fs
            -e STORAGE_FS_PATH=/data
          )

          # Migrations must apply from the image itself.
          docker run --rm --network pjokk-ci "${env_args[@]}" pjokk:ci \
            migrate

          docker run -d --name app --network pjokk-ci -p 3000:3000 \
            "${env_args[@]}" pjokk:ci

          # It must actually serve, not merely start. /readyz proves it
          # reached Postgres; "/" proves the SPA shell wins there — pure
          # route ordering, and just as easy to break the other way if a
          # health or API route ever stops taking priority over the
          # static-file fallback.
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/healthz && break
            sleep 1
          done
          curl -fsS http://localhost:3000/readyz | grep -q '"ok":true'
          curl -fsS http://localhost:3000/ | grep -qi '<title>Pjokk'
          curl -fsS http://localhost:3000/robots.txt | grep -q 'Disallow: /'

          # The server is a compiled Go binary in a shell-less image, and
          # `go test` runs against source — so this probe is the only thing
          # standing between a build/link regression and production. It
          # needs no fixtures.
          #
          # A sign-in with unknown credentials must answer 401. Reaching that
          # answer means Limen loaded, its Postgres adapter resolved, and a
          # query ran end to end — the code path most at risk from anything
          # that breaks at link time, since Limen resolves its plugin chain
          # at startup. A broken build gives 500 here, not 401. Body field is
          # "credential" (Limen's credential-password plugin), not "email".
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST http://localhost:3000/api/auth/signin/credential \
            -H 'content-type: application/json' -H 'origin: http://localhost:3000' \
            -d '{"credential":"nobody@example.invalid","password":"wrong-password"}')
          test "$status" = "401" || { echo "sign-in probe returned $status, expected 401"; exit 1; }

          # That request also had to WRITE: the rate limiter increments a
          # Postgres row per attempt. A non-empty table proves the write path
          # works end to end in the bundle.
          docker exec pg psql -U pjokk -d pjokk -tAc \
            'SELECT count(*) FROM rate_limit' | grep -qvx '0'

          # And the cron entrypoint has to run from the same image.
          docker run --rm --network pjokk-ci "${env_args[@]}" pjokk:ci \
            cron frequent

      # The Playwright suite drives the same smoke-tested image through a real
      # browser — sign-in, family setup, logging flows. It needs signup open
      # (the suite creates its own accounts), so the app container restarts
      # with OPEN_SIGNUP=1 against the same database.
      - name: Restart app with signup open
        run: |
          docker rm -f app
          docker run -d --name app --network pjokk-ci -p 3000:3000 \
            -e DATABASE_URL=postgres://pjokk:pjokk@pg:5432/pjokk \
            -e APP_URL=http://localhost:3000 \
            -e AUTH_SECRET=ci-smoke-test-secret-at-least-32-bytes-long \
            -e STORAGE_DRIVER=fs -e STORAGE_FS_PATH=/data \
            -e OPEN_SIGNUP=1 \
            pjokk:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/healthz && break
            sleep 1
          done

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: E2E tests
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: cd e2e && bunx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore

      # Only after the smoke test: an image that does not serve must never
      # reach the registry, not even as a preview.
      #
      # Two tags per push: <next>-pr.<n> moves with the PR (grab the PR's
      # current state), <next>-pr.<n>.<sha> never moves. Both are valid
      # semver prereleases of the release they precede.
      - name: Push preview image (multi-arch)
        if: steps.gate.outputs.push == 'true'
        run: |
          short=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-7)
          pr="${{ github.event.pull_request.number }}"
          moving="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-pr.${pr}"
          pinned="${moving}.${short}"
          # The same context the smoke-tested image came from; buildx just
          # re-runs the COPYs per platform and pushes the manifest list.
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t "$moving" -t "$pinned" --push .
          {
            echo "### Preview image"
            echo
            echo '```'
            echo "docker pull $moving"
            echo '```'
            echo
            echo "Also tagged \`$pinned\` (immutable)."
            echo "Next release would be **${{ steps.version.outputs.tag }}**."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Container logs on failure
        if: failure()
        run: docker logs app || true
