name: Release

# Manually triggered (Actions → Release → Run workflow, or
# `gh workflow run release.yml`). The button is the approval gate: GitHub's
# required-reviewers environment rule needs a paid plan on private repos, so
# the dispatch itself plays that role — only collaborators can trigger it, and
# the full test suite still gates the release. If the repo ever moves to
# GitHub Pro/Team, add required reviewers to the "production" environment and
# this workflow picks the gate up unchanged.
#
# The version is NOT typed in by hand. svu computes it from Conventional
# Commits since the last v* tag, which is why CLAUDE.md mandates the commit
# format — the changelog (GoReleaser) and the version number (svu) are both
# downstream of it.
#
# This workflow TAGS, then GoReleaser BUILDS AND PUBLISHES everything from
# the tag: binaries, archives, checksums, SBOMs, cosign signatures, the
# multi-arch image, and the GitHub Release with changelog. The tag comes
# FIRST because GoReleaser releases from a tag; a failed publish deletes it
# again (the old flow tagged last for the same never-a-dangling-tag goal). It does not roll out: where the
# container runs is deployment infrastructure this repo does not own. Rolling
# out means, in order:
#
#   1. `/app/pjokk migrate` as a one-off (Job / initContainer / compose
#      `migrate` service). Before the new image serves traffic: migrations are
#      append-only, so old code running briefly against a newer schema is
#      safe, whereas new code against an older schema is not.
#   2. Point the deployment at the new tag and let the rollout proceed.
#      /readyz gates each replica; SIGTERM drains it.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute and build, but do not push or tag"
        type: boolean
        default: true
      allow_major:
        description: "Permit a 1.0.0 release (breaking changes bump minor while the major is 0)"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      releasable: ${{ steps.v.outputs.releasable }}
    steps:
      # Tags and full history are the inputs to the calculation.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "aqua:caarlos0/svu"

      # svu reads Conventional Commits since the last v* tag. --v0 keeps
      # breaking changes bumping the minor while the major is 0; the
      # allow_major input drops it to permit 1.0.0.
      - name: Compute version
        id: v
        run: |
          current=$(svu current)
          if [ "${{ inputs.allow_major }}" = "true" ]; then
            tag=$(svu next)
          else
            tag=$(svu next --v0)
          fi
          version="${tag#v}"
          releasable=true
          if [ "$tag" = "$current" ]; then releasable=false; fi
          {
            echo "tag=$tag"; echo "version=$version"; echo "releasable=$releasable"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Version"
            echo "- current: \`$current\`"
            echo "- next:    \`$tag\` (releasable: $releasable)"
          } | tee "$GITHUB_STEP_SUMMARY"

      # Releasing "the same version again" is the mistake worth blocking: it
      # means nothing since the last tag actually warranted a release.
      - name: Refuse an empty release
        if: steps.v.outputs.releasable != 'true'
        run: |
          echo "No feat/fix/perf/breaking commits since the last tag — nothing to release."
          exit 1

  verify:
    needs: version
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pjokk
          POSTGRES_PASSWORD: pjokk
          POSTGRES_DB: pjokk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pjokk -d pjokk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgres://pjokk:pjokk@127.0.0.1:5432/pjokk_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Toolchain from .mise.toml — same pins as CI and local dev.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: go bun

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('apps/server/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint + typecheck
        run: bun run check

      - name: Tests
        run: bun run test

      # The backend is Go and outside the bun workspace, so the two steps
      # above cover only the SPA and the landing site. Without these a
      # release could publish an image whose server was never tested.
      - name: Go vet
        run: cd apps/server && go vet ./...

      - name: Go tests
        run: cd apps/server && go test -p 1 -count=1 ./...

  publish:
    needs: [version, verify]
    runs-on: ubuntu-latest
    environment:
      name: production
      # The artifact this job publishes is the container image, which serves
      # the app — not the static landing site on the apex.
      url: https://app.pjokk.no
    permissions:
      contents: write   # the git tag + the GitHub Release
      packages: write   # ghcr.io
      id-token: write   # keyless cosign signing (GitHub OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "go bun aqua:goreleaser/goreleaser aqua:sigstore/cosign aqua:anchore/syft"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('apps/server/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      # GoReleaser's before hook builds the SPA; that needs node_modules.
      - name: Install
        run: bun install --frozen-lockfile

      - name: Log in to the container registry
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dry run: the full pipeline (binaries, archives, SBOMs, image build)
      # with nothing pushed, tagged or signed.
      - name: GoReleaser (snapshot)
        if: ${{ inputs.dry_run }}
        run: |
          trap 'bash scripts/restore-embed-overlay.sh' EXIT
          goreleaser release --snapshot --clean --skip=sign

      # The real thing. GoReleaser releases FROM a tag, so the tag is
      # created first — and deleted again below if anything after it fails,
      # preserving the old flow's "never a tag without a release" property.
      - name: Tag the release
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.version.outputs.tag }}" -m "${{ needs.version.outputs.tag }}"
          git push origin "${{ needs.version.outputs.tag }}"

      - name: GoReleaser (publish)
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          trap 'bash scripts/restore-embed-overlay.sh' EXIT
          goreleaser release --clean

      - name: Delete the tag on failure
        if: ${{ failure() && !inputs.dry_run }}
        run: |
          gh release delete "${{ needs.version.outputs.tag }}" --yes || true
          git push --delete origin "${{ needs.version.outputs.tag }}" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          {
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "### Dry run — nothing pushed, nothing tagged"
            else
              echo "### Released ${{ needs.version.outputs.tag }}"
            fi
            echo
            echo "- version: \`${{ needs.version.outputs.version }}\`"
            echo "- image:   \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.version.outputs.version }}\` (amd64+arm64, cosign-signed)"
            echo "- release: binaries, checksums, SBOMs and signatures on the GitHub Release"
          } >> "$GITHUB_STEP_SUMMARY"
