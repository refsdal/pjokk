name: Release production image

# Manually triggered (Actions → Release production image → Run workflow, or
# `gh workflow run deploy-prod.yml`). The button is the approval gate:
# GitHub's required-reviewers environment rule needs a paid plan on private
# repos, so the dispatch itself plays that role — only collaborators can
# trigger it, and the full test suite still gates the release. If the repo
# ever moves to GitHub Pro/Team, add required reviewers to the "production"
# environment and this workflow picks the gate up unchanged.
#
# This workflow BUILDS AND PUBLISHES an image; it does not roll it out. That
# stops at the registry on purpose — where the container runs is deployment
# infrastructure this repo does not own. Rolling out means, in order:
#
#   1. `bun migrate.js` as a one-off (Job / initContainer / compose `migrate`
#      service). Before the new image serves traffic: migrations are
#      append-only, so old code running briefly against a newer schema is
#      safe, whereas new code against an older schema is not.
#   2. Point the deployment at the new tag and let the rollout proceed.
#      /readyz gates each replica; SIGTERM drains it.

on:
  workflow_dispatch:

concurrency:
  group: release-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pjokk
          POSTGRES_PASSWORD: pjokk
          POSTGRES_DB: pjokk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pjokk -d pjokk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgres://pjokk:pjokk@127.0.0.1:5432/pjokk_test

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint + typecheck
        run: bun run check

      - name: Tests
        run: bun test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://pjokk.no
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # A moving "latest" plus an immutable sha tag: deployments should
          # pin the sha, so a rollback is naming an older one rather than
          # rebuilding and hoping.
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
