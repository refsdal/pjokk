# Pjokk, whole stack, one command:
#
#   cp .env.example .env    # then set BETTER_AUTH_SECRET at minimum
#   docker compose up
#
# Postgres holds the data, MinIO stands in for S3 (vaccine documents and the
# nightly backups), and the app runs with its in-process scheduler because a
# single container has no orchestrator to drive cron for it.

name: pjokk

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pjokk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pjokk}
      POSTGRES_DB: pjokk
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # -d as well as -U: without the database name pg_isready reports ready
      # while the init scripts are still creating it, and the migration job
      # then fails on a database that does not exist yet.
      test: ["CMD-SHELL", "pg_isready -U pjokk -d pjokk"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-pjokkdev}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-pjokkdevsecret}
    volumes:
      - minio-data:/data
    ports:
      # Console only, for poking at the bucket. The app reaches MinIO over the
      # compose network, so the API port needs no host binding.
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the bucket, then exits. MinIO has no "create bucket on boot"
  # setting, and the app deliberately does not create buckets itself: an app
  # that can create a bucket can also create the wrong one, in the wrong
  # region, and nobody notices until the data is somewhere unintended.
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000
      '${S3_ACCESS_KEY_ID:-pjokkdev}' '${S3_SECRET_ACCESS_KEY:-pjokkdevsecret}' &&
      mc mb --ignore-existing local/${S3_BUCKET:-pjokk-files} &&
      echo 'bucket ready'
      "

  # Applies pending migrations, then exits. A separate one-off rather than
  # something the app does at startup: drizzle's migrator does not coordinate
  # between processes, so scaling the app to two replicas would have them race
  # to apply the same DDL.
  migrate:
    build: .
    command: ["bun", "src/server/migrate.ts"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://pjokk:${POSTGRES_PASSWORD:-pjokk}@db:5432/pjokk
      # loadEnv validates the whole configuration even for a migration, so the
      # required keys must be present here too.
      APP_URL: ${APP_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env, generate one with openssl rand -base64 32}"
      S3_BUCKET: ${S3_BUCKET:-pjokk-files}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-pjokkdev}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-pjokkdevsecret}

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://pjokk:${POSTGRES_PASSWORD:-pjokk}@db:5432/pjokk
      APP_URL: ${APP_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}"
      S3_BUCKET: ${S3_BUCKET:-pjokk-files}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-pjokkdev}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-pjokkdevsecret}

      # One container, no orchestrator to run CronJobs — so the scheduler runs
      # in-process. Leave this OFF under Kubernetes and drive `bun run cron`
      # from a CronJob instead, or every replica fires every reminder.
      SCHEDULER: "1"

      # A local stack is not on the public internet and must not be indexed.
      INDEXABLE: ${INDEXABLE:-0}
      OPEN_SIGNUP: ${OPEN_SIGNUP:-0}

      # Behind a reverse proxy, set this to the number of proxies in front —
      # otherwise the rate limiter ignores X-Forwarded-For (by design) and
      # buckets every caller together.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}

      # Optional subsystems. Absent means the feature is simply off; the app
      # logs which ones at startup.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PREMIUM_MONTHLY: ${STRIPE_PRICE_PREMIUM_MONTHLY:-}
      STRIPE_PRICE_PREMIUM_YEARLY: ${STRIPE_PRICE_PREMIUM_YEARLY:-}
      STRIPE_PRICE_PREMIUM_LIFETIME: ${STRIPE_PRICE_PREMIUM_LIFETIME:-}

volumes:
  db-data:
  minio-data:
