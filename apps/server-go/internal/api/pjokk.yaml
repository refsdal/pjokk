openapi: 3.0.3
info:
  title: Pjokk API
  description: >-
    Pjokk is a self-hosted baby tracker for families. This spec is the single
    source of truth for the Go server's HTTP surface: it drives runtime
    request validation (kin-openapi nethttp-middleware), the generated
    strict-server routes and types (oapi-codegen), and the interactive docs
    served at /api/docs (Scalar, reading /api/openapi.json — this file,
    converted to JSON at runtime).
  version: "1.0.0"
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: healthz
      summary: Liveness probe. Touches nothing — not even the database pool.
      tags: [system]
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
  /readyz:
    get:
      operationId: readyz
      summary: Readiness probe. Runs `SELECT 1` against the database pool.
      tags: [system]
      responses:
        "200":
          description: The process is ready to serve traffic.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
        "503":
          description: The database is unreachable.
          content:
            application/json:
              schema:
                type: object
                required: [ok, error]
                properties:
                  ok:
                    type: boolean
                    enum: [false]
                  error:
                    type: string

  /api/babies:
    get:
      operationId: listBabies
      summary: Babies in the caller's active family, oldest first.
      tags: [babies]
      responses:
        "200":
          description: Babies in the active family.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Baby"
    post:
      operationId: createBaby
      summary: Create a baby in the caller's active family. Free — no plan gate.
      tags: [babies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBaby"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Baby"
  /api/babies/{id}:
    patch:
      operationId: updateBaby
      summary: >-
        Partial update. An empty body is a no-op that returns the baby
        unchanged.
      tags: [babies]
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBaby"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Baby"
        "404":
          description: No baby with this id in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteBaby
      summary: >-
        Family-admin only. Deletes the baby and EVERY log for them
        (cascade).
      tags: [babies]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "403":
          description: Family admin only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No baby with this id in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/family:
    get:
      operationId: getFamily
      summary: The caller's active family.
      tags: [family]
      responses:
        "200":
          description: The active family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"
        "404":
          description: Family missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/family/members:
    get:
      operationId: listFamilyMembers
      summary: Caretakers in the caller's active family.
      tags: [family]
      responses:
        "200":
          description: Caretakers in the family.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
  /api/family/members/{memberId}:
    delete:
      operationId: deleteFamilyMember
      summary: Remove a member from the caller's active family. Family-admin only.
      tags: [family]
      parameters:
        - $ref: "#/components/parameters/memberIdPath"
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "403":
          description: Family admin only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such member in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/family/members/{memberId}/role:
    post:
      operationId: setFamilyMemberRole
      summary: Change a member's role in the caller's active family. Family-admin only.
      tags: [family]
      parameters:
        - $ref: "#/components/parameters/memberIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMemberRole"
      responses:
        "200":
          description: Role changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "403":
          description: Family admin only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such member in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/feeds:
    get:
      operationId: listFeeds
      summary: Feed logs in the caller's active family, newest first.
      tags: [feeds]
      parameters:
        - $ref: "#/components/parameters/babyIdQuery"
        - $ref: "#/components/parameters/limitQuery"
      responses:
        "200":
          description: Feed logs, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedLog"
    post:
      operationId: createFeed
      summary: Log a feed for a baby in the caller's active family.
      tags: [feeds]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFeed"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedLog"
        "404":
          description: Unknown baby.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/feeds/{id}:
    patch:
      operationId: updateFeed
      summary: >-
        Partial update. A field sent as `null` clears the column; an
        omitted field is left unchanged; an empty body is a no-op that
        returns the feed unchanged. `time`/`type` are not nullable — only
        settable or omitted. See internal/api/feeds.go for how this
        endpoint tells "omitted" apart from "null" (the generated request
        type alone cannot).
      tags: [feeds]
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFeed"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedLog"
        "404":
          description: No feed with this id in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteFeed
      summary: Delete a feed log.
      tags: [feeds]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "404":
          description: No feed with this id in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/diapers:
    get:
      operationId: listDiapers
      summary: Diaper logs in the caller's active family, newest first.
      tags: [diapers]
      parameters:
        - $ref: "#/components/parameters/babyIdQuery"
        - $ref: "#/components/parameters/limitQuery"
      responses:
        "200":
          description: Diaper logs, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiaperLog"
    post:
      operationId: createDiaper
      summary: Log a diaper change for a baby in the caller's active family.
      tags: [diapers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDiaper"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiaperLog"
        "404":
          description: Unknown baby.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/diapers/{id}:
    patch:
      operationId: updateDiaper
      summary: >-
        Partial update. A field sent as `null` clears the column; an
        omitted field is left unchanged; an empty body is a no-op that
        returns the diaper log unchanged. `time`/`type` are not nullable —
        only settable or omitted. See internal/api/feeds.go for how this
        endpoint tells "omitted" apart from "null" (the generated request
        type alone cannot).
      tags: [diapers]
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDiaper"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiaperLog"
        "404":
          description: No diaper log with this id in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteDiaper
      summary: Delete a diaper log.
      tags: [diapers]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "404":
          description: No diaper log with this id in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/sleep:
    get:
      operationId: listSleeps
      summary: Sleep logs in the caller's active family, newest first (by startTime).
      tags: [sleep]
      parameters:
        - $ref: "#/components/parameters/babyIdQuery"
        - $ref: "#/components/parameters/limitQuery"
      responses:
        "200":
          description: Sleep logs, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SleepLog"
    post:
      operationId: createSleep
      summary: >-
        Create a sleep log. Omit endTime to start an active session; a baby
        can only have one active session at a time — enforced by a partial
        unique index (see internal/api/sleep.go), not just the pre-check
        this endpoint also does.
      tags: [sleep]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSleep"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SleepLog"
        "404":
          description: Unknown baby.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Baby already has an active session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sleep/active:
    get:
      operationId: getActiveSleep
      summary: The active sleep session for a baby, or null.
      tags: [sleep]
      parameters:
        - $ref: "#/components/parameters/babyIdQuery"
      responses:
        "200":
          description: The active sleep session, or null.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SleepLog"
                nullable: true
  /api/sleep/{id}/wake:
    post:
      operationId: wakeSleep
      summary: End the active session for a sleep log. endTime defaults to now.
      tags: [sleep]
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Wake"
      responses:
        "200":
          description: Session ended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SleepLog"
        "404":
          description: No such active session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sleep/{id}:
    patch:
      operationId: updateSleep
      summary: >-
        Partial update. `endTime` sent as `null` CLEARS it, reopening the
        session — subject to the same one-active-session-per-baby
        constraint as create, so this can also 409. `location`/`notes` may
        also be sent as `null` to clear them; `startTime` is not nullable —
        only settable or omitted. See internal/api/feeds.go for the
        omitted-vs-null presence-detection pattern this endpoint needs.
      tags: [sleep]
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSleep"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SleepLog"
        "404":
          description: No sleep log with this id in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            Clearing endTime would reopen a session while another is
            already active for this baby.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteSleep
      summary: Delete a sleep log.
      tags: [sleep]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "404":
          description: No sleep log with this id in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/sleep-locations:
    get:
      operationId: listSleepLocations
      summary: Custom sleep-location chips for the caller's active family.
      tags: [sleep-locations]
      responses:
        "200":
          description: Custom sleep locations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SleepLocation"
    post:
      operationId: createSleepLocation
      summary: >-
        Family-admin only; not available to API keys. Rejects a name that
        duplicates a default chip or an existing custom one
        (case-insensitive), and caps custom locations at 20 per family.
      tags: [sleep-locations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSleepLocation"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SleepLocation"
        "403":
          description: Family admin only, or an API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Duplicate name or limit reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sleep-locations/{id}:
    delete:
      operationId: deleteSleepLocation
      summary: Family-admin only; not available to API keys.
      tags: [sleep-locations]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "403":
          description: Family admin only, or an API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such location in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/summary:
    get:
      operationId: getSummary
      summary: >-
        Everything the home screen needs in one call: last feed, last
        diaper, active + last sleep, active play, and today's local-day
        totals.
      tags: [summary]
      parameters:
        - name: babyId
          in: query
          required: true
          schema:
            type: string
        - name: tz
          in: query
          required: false
          description: >-
            The requester's Date.getTimezoneOffset() (minutes,
            UTC-minus-local). The `today` block follows the caretaker's
            clock, not the server's. Defaults to 0 (UTC) when omitted.
          schema:
            type: integer
            minimum: -840
            maximum: 840
            default: 0
      responses:
        "200":
          description: Status summary for a baby.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Summary"
        "404":
          description: Unknown baby.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/me:
    get:
      operationId: getMe
      summary: >-
        Session info for the SPA shell. Requires a session but NOT an
        active family — the family/member/plan fields are null when the
        caller has none.
      tags: [me]
      responses:
        "200":
          description: The caller's session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"

components:
  parameters:
    babyIdQuery:
      name: babyId
      in: query
      description: Restrict the result to one baby in the caller's family.
      required: false
      schema:
        type: string
    limitQuery:
      name: limit
      in: query
      description: Maximum number of rows to return.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
    idPath:
      name: id
      in: path
      description: Resource id.
      required: true
      schema:
        type: string
    memberIdPath:
      name: memberId
      in: path
      description: The family-membership row id (NOT the user id).
      required: true
      schema:
        type: string
  schemas:
    Ok:
      type: object
      description: The standard `{ok:true}` success body for actions with no other payload.
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]
    Baby:
      type: object
      required: [id, name, birthDate, sex]
      properties:
        id:
          type: string
        name:
          type: string
        birthDate:
          type: string
          format: date-time
        sex:
          type: string
          enum: [girl, boy]
          nullable: true
      x-go-name: Baby
    CreateBaby:
      type: object
      required: [name, birthDate]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        birthDate:
          type: string
          format: date-time
        sex:
          type: string
          enum: [girl, boy]
    UpdateBaby:
      type: object
      description: >-
        Every field is optional; an empty object is a no-op. `sex` may also
        be sent as `null`, which — like omitting it — leaves the baby's sex
        unchanged (Go's JSON decoding cannot tell "absent" from "null" for a
        nullable-optional field without a bespoke wrapper type, and no
        caller needs to clear sex back to unknown today; see
        internal/api/babies.go).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        birthDate:
          type: string
          format: date-time
        sex:
          type: string
          enum: [girl, boy]
          nullable: true
    Member:
      type: object
      required: [memberId, userId, name, email, role, image]
      properties:
        memberId:
          type: string
          description: The family-membership row id (NOT the user id).
        userId:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
        image:
          type: string
          nullable: true
    Family:
      type: object
      required: [id, name, slug, plan]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        plan:
          type: string
    SetMemberRole:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, member]
    Me:
      type: object
      description: >-
        familyId/memberRole/plan/impersonatedBy are null when the caller has
        no active family (or, for impersonatedBy, is not impersonated).
      required:
        [userId, name, email, role, familyId, memberRole, plan, impersonatedBy]
      properties:
        userId:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          nullable: true
          description: Ours, system-admin role. "admin" or null.
        familyId:
          type: string
          nullable: true
        memberRole:
          type: string
          nullable: true
        plan:
          type: string
          nullable: true
        impersonatedBy:
          type: string
          nullable: true
    FeedLog:
      type: object
      required:
        - id
        - babyId
        - caretakerId
        - caretakerName
        - notes
        - time
        - type
        - amountMl
        - side
        - durationMin
        - leftMin
        - rightMin
      properties:
        id:
          type: string
        babyId:
          type: string
        caretakerId:
          type: string
        caretakerName:
          type: string
        notes:
          type: string
          nullable: true
        time:
          type: string
          format: date-time
        type:
          type: string
          enum: [bottle, breast, solids]
        amountMl:
          type: integer
          format: int32
          nullable: true
        side:
          type: string
          enum: [left, right, both]
          nullable: true
        durationMin:
          type: integer
          format: int32
          nullable: true
        leftMin:
          type: integer
          format: int32
          nullable: true
        rightMin:
          type: integer
          format: int32
          nullable: true
    CreateFeed:
      type: object
      required: [babyId, time, type]
      properties:
        babyId:
          type: string
        time:
          type: string
          format: date-time
        type:
          type: string
          enum: [bottle, breast, solids]
        amountMl:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000
        side:
          type: string
          enum: [left, right, both]
        durationMin:
          type: integer
          format: int32
          minimum: 0
          maximum: 600
        leftMin:
          type: integer
          format: int32
          minimum: 0
          maximum: 600
          nullable: true
        rightMin:
          type: integer
          format: int32
          minimum: 0
          maximum: 600
          nullable: true
        notes:
          type: string
          maxLength: 1000
    UpdateFeed:
      type: object
      description: >-
        Every field is optional; an empty object is a no-op. `amountMl`,
        `side`, `durationMin`, `leftMin`, `rightMin` and `notes` may also be
        sent as `null` to CLEAR that column; `time`/`type` are not nullable
        — only settable or omitted (see internal/api/feeds.go for the
        omitted-vs-null presence-detection pattern this endpoint needs,
        which the generated request type alone cannot provide).
      properties:
        time:
          type: string
          format: date-time
        type:
          type: string
          enum: [bottle, breast, solids]
        amountMl:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000
          nullable: true
        side:
          type: string
          enum: [left, right, both]
          nullable: true
        durationMin:
          type: integer
          format: int32
          minimum: 0
          maximum: 600
          nullable: true
        leftMin:
          type: integer
          format: int32
          minimum: 0
          maximum: 600
          nullable: true
        rightMin:
          type: integer
          format: int32
          minimum: 0
          maximum: 600
          nullable: true
        notes:
          type: string
          maxLength: 1000
          nullable: true
    DiaperLog:
      type: object
      required: [id, babyId, caretakerId, caretakerName, notes, time, type]
      properties:
        id:
          type: string
        babyId:
          type: string
        caretakerId:
          type: string
        caretakerName:
          type: string
        notes:
          type: string
          nullable: true
        time:
          type: string
          format: date-time
        type:
          type: string
          enum: [wet, dirty, both]
    CreateDiaper:
      type: object
      required: [babyId, time, type]
      properties:
        babyId:
          type: string
        time:
          type: string
          format: date-time
        type:
          type: string
          enum: [wet, dirty, both]
        notes:
          type: string
          maxLength: 1000
    UpdateDiaper:
      type: object
      description: >-
        Every field is optional; an empty object is a no-op. `notes` may
        also be sent as `null` to CLEAR it; `time`/`type` are not nullable —
        only settable or omitted (see internal/api/feeds.go for the
        presence-detection pattern this endpoint shares with UpdateFeed).
      properties:
        time:
          type: string
          format: date-time
        type:
          type: string
          enum: [wet, dirty, both]
        notes:
          type: string
          maxLength: 1000
          nullable: true
    SleepLog:
      type: object
      required:
        - id
        - babyId
        - caretakerId
        - caretakerName
        - notes
        - startTime
        - endTime
        - location
      properties:
        id:
          type: string
        babyId:
          type: string
        caretakerId:
          type: string
        caretakerName:
          type: string
        notes:
          type: string
          nullable: true
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
          nullable: true
          description: null while the session is active.
        location:
          type: string
          nullable: true
    CreateSleep:
      type: object
      required: [babyId, startTime]
      properties:
        babyId:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
          description: Omit to start an active sleep session.
        location:
          type: string
          maxLength: 100
        notes:
          type: string
          maxLength: 1000
    UpdateSleep:
      type: object
      description: >-
        Every field is optional; an empty object is a no-op. `endTime`,
        `location` and `notes` may also be sent as `null` to CLEAR that
        column — clearing `endTime` reopens the session and can 409 if
        another session for the same baby is already active (see
        internal/api/sleep.go). `startTime` is not nullable — only settable
        or omitted.
      properties:
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
          nullable: true
        location:
          type: string
          maxLength: 100
          nullable: true
        notes:
          type: string
          maxLength: 1000
          nullable: true
    Wake:
      type: object
      description: Defaults endTime to now on the server when omitted.
      properties:
        endTime:
          type: string
          format: date-time
    SleepLocation:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    CreateSleepLocation:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
    PlayLog:
      type: object
      description: >-
        The Task 13 route surface (play.ts's port) isn't built yet; this
        schema exists only so /api/summary's activePlay field has a
        documented shape — the play_log table itself already exists in the
        schema (Task 3).
      required:
        - id
        - babyId
        - caretakerId
        - caretakerName
        - notes
        - type
        - startTime
        - endTime
      properties:
        id:
          type: string
        babyId:
          type: string
        caretakerId:
          type: string
        caretakerName:
          type: string
        notes:
          type: string
          nullable: true
        type:
          type: string
          enum: [tummy, walk, play]
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
          nullable: true
          description: null while the activity is running.
    Summary:
      type: object
      required:
        - lastFeed
        - lastDiaper
        - activeSleep
        - lastSleep
        - activePlay
        - today
      properties:
        lastFeed:
          allOf:
            - $ref: "#/components/schemas/FeedLog"
          nullable: true
        lastDiaper:
          allOf:
            - $ref: "#/components/schemas/DiaperLog"
          nullable: true
        activeSleep:
          allOf:
            - $ref: "#/components/schemas/SleepLog"
          nullable: true
        lastSleep:
          allOf:
            - $ref: "#/components/schemas/SleepLog"
          nullable: true
        activePlay:
          allOf:
            - $ref: "#/components/schemas/PlayLog"
          nullable: true
        today:
          type: object
          required: [feeds, intakeMl, solidsG, wet, dirty, both, sleepMin]
          properties:
            feeds:
              type: integer
              format: int32
            intakeMl:
              type: integer
              format: int32
            solidsG:
              type: integer
              format: int32
            wet:
              type: integer
              format: int32
            dirty:
              type: integer
              format: int32
            both:
              type: integer
              format: int32
            sleepMin:
              type: integer
              format: int32
    Error:
      type: object
      description: >-
        The error envelope used by every non-2xx JSON response in the API
        (CLAUDE.md: "{error: string, code: string}" everywhere).
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
        issues:
          type: array
          description: >-
            Optional per-field validation issues. The frontend only reads
            error/code today; issues exist for future, more specific UI.
          items:
            type: object
            required: [path, message]
            properties:
              path:
                type: string
              message:
                type: string
