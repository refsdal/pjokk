  /api/play:
    get:
      operationId: listPlays
      summary: Play logs in the caller's active family, newest first (by startTime).
      tags: [play]
      parameters:
        - $ref: "#/components/parameters/babyIdQuery"
        - $ref: "#/components/parameters/limitQuery"
      responses:
        "200":
          description: Play logs, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayLog"
    post:
      operationId: createPlay
      summary: >-
        Create a play log. Omit endTime to start a running session; a baby
        can only have one running activity at a time — enforced by a
        partial unique index (see internal/api/play.go), not just the
        pre-check this endpoint also does. Free (no plan gate).
      tags: [play]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlay"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayLog"
        "404":
          description: Unknown baby.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Baby already has a running activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/play/active:
    get:
      operationId: getActivePlay
      summary: The running play session for a baby, or null.
      tags: [play]
      parameters:
        - $ref: "#/components/parameters/babyIdQuery"
      responses:
        "200":
          description: The running play session, or null.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PlayLog"
                nullable: true
  /api/play/{id}/stop:
    post:
      operationId: stopPlay
      summary: End the running session for a play log. endTime defaults to now.
      tags: [play]
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StopPlay"
      responses:
        "200":
          description: Session ended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayLog"
        "404":
          description: No such running session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/play/{id}:
    patch:
      operationId: updatePlay
      summary: >-
        Partial update. `endTime` sent as `null` CLEARS it, reopening the
        session — subject to the same one-running-session-per-baby
        constraint as create, so this can also 409. `notes` may also be
        sent as `null` to clear it; `type`/`startTime` are not nullable —
        only settable or omitted. See internal/api/feeds.go for the
        omitted-vs-null presence-detection pattern this endpoint needs.
      tags: [play]
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlay"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayLog"
        "404":
          description: No play log with this id in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            Clearing endTime would reopen a session while another is
            already running for this baby.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deletePlay
      summary: Delete a play log.
      tags: [play]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "404":
          description: No play log with this id in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/me:
    get:
      operationId: getMe
      summary: >-
        Session info for the SPA shell. Requires a session but NOT an
        active family — the family/member/plan fields are null when the
        caller has none.
      tags: [me]
      responses:
        "200":
          description: The caller's session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"

components:
  parameters:
    babyIdQuery:
      name: babyId
      in: query
      description: Restrict the result to one baby in the caller's family.
      required: false
      schema:
        type: string
    limitQuery:
      name: limit
      in: query
      description: Maximum number of rows to return.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
    idPath:
      name: id
      in: path
      description: Resource id.
      required: true
      schema:
        type: string
    memberIdPath:
      name: memberId
      in: path
      description: The family-membership row id (NOT the user id).
      required: true
      schema:
        type: string
  schemas:
    Ok:
      type: object
      description: The standard `{ok:true}` success body for actions with no other payload.
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]
    Baby:
      type: object
      required: [id, name, birthDate, sex]
      properties:
        id:
          type: string
        name:
          type: string
        birthDate:
          type: string
          format: date-time
        sex:
          type: string
          enum: [girl, boy]
          nullable: true
      x-go-name: Baby
    CreateBaby:
      type: object
      required: [name, birthDate]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        birthDate:
          type: string
          format: date-time
        sex:
          type: string
          enum: [girl, boy]
    UpdateBaby:
      type: object
      description: >-
        Every field is optional; an empty object is a no-op. `sex` may also
        be sent as `null`, which — like omitting it — leaves the baby's sex
        unchanged (Go's JSON decoding cannot tell "absent" from "null" for a
        nullable-optional field without a bespoke wrapper type, and no
        caller needs to clear sex back to unknown today; see
        internal/api/babies.go).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        birthDate:
          type: string
          format: date-time
        sex:
          type: string
          enum: [girl, boy]
          nullable: true
    Member:
      type: object
      required: [memberId, userId, name, email, role, image]
      properties:
        memberId:
          type: string
          description: The family-membership row id (NOT the user id).
        userId:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
        image:
          type: string
          nullable: true
    Family:
      type: object
      required: [id, name, slug, plan]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        plan:
          type: string
    SetMemberRole:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, member]
    Me:
      type: object
      description: >-
        familyId/memberRole/plan/impersonatedBy are null when the caller has
        no active family (or, for impersonatedBy, is not impersonated).
      required:
        [userId, name, email, role, familyId, memberRole, plan, impersonatedBy]
      properties:
        userId:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          nullable: true
          description: Ours, system-admin role. "admin" or null.
        familyId:
          type: string
          nullable: true
        memberRole:
          type: string
          nullable: true
        plan:
          type: string
          nullable: true
        impersonatedBy:
          type: string
          nullable: true
    FeedLog:
      type: object
      required:
        - id
        - babyId
        - caretakerId
        - caretakerName
        - notes
        - time
        - type
        - amountMl
        - side
        - durationMin
        - leftMin
        - rightMin
      properties:
        id:
          type: string
        babyId:
          type: string
        caretakerId:
          type: string
        caretakerName:
          type: string
        notes:
          type: string
          nullable: true
        time:
          type: string
          format: date-time
        type:
          type: string
          enum: [bottle, breast, solids]
        amountMl:
          type: integer
          format: int32
          nullable: true
        side:
          type: string
          enum: [left, right, both]
          nullable: true
        durationMin:
          type: integer
          format: int32
          nullable: true
        leftMin:
          type: integer
          format: int32
          nullable: true
        rightMin:
          type: integer
          format: int32
          nullable: true
    CreateFeed:
      type: object
      required: [babyId, time, type]
      properties:
        babyId:
          type: string
        time:
          type: string
          format: date-time
        type:
          type: string
          enum: [bottle, breast, solids]
        amountMl:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000
        side:
          type: string
          enum: [left, right, both]
        durationMin:
          type: integer
          format: int32
          minimum: 0
          maximum: 600
        leftMin:
          type: integer
          format: int32
          minimum: 0
          maximum: 600
          nullable: true
        rightMin:
          type: integer
          format: int32
          minimum: 0
          maximum: 600
          nullable: true
        notes:
          type: string
          maxLength: 1000
    UpdateFeed:
      type: object
      description: >-
        Every field is optional; an empty object is a no-op. `amountMl`,
        `side`, `durationMin`, `leftMin`, `rightMin` and `notes` may also be
        sent as `null` to CLEAR that column; `time`/`type` are not nullable
        — only settable or omitted (see internal/api/feeds.go for the
        omitted-vs-null presence-detection pattern this endpoint needs,
        which the generated request type alone cannot provide).
      properties:
        time:
          type: string
          format: date-time
        type:
          type: string
          enum: [bottle, breast, solids]
        amountMl:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000
          nullable: true
        side:
          type: string
          enum: [left, right, both]
          nullable: true
        durationMin:
          type: integer
          format: int32
          minimum: 0
          maximum: 600
          nullable: true
        leftMin:
          type: integer
          format: int32
          minimum: 0
          maximum: 600
          nullable: true
        rightMin:
          type: integer
          format: int32
          minimum: 0
          maximum: 600
          nullable: true
        notes:
          type: string
          maxLength: 1000
          nullable: true
    DiaperLog:
      type: object
      required: [id, babyId, caretakerId, caretakerName, notes, time, type]
      properties:
        id:
          type: string
        babyId:
          type: string
        caretakerId:
          type: string
        caretakerName:
          type: string
        notes:
          type: string
          nullable: true
        time:
          type: string
          format: date-time
        type:
          type: string
          enum: [wet, dirty, both]
    CreateDiaper:
      type: object
      required: [babyId, time, type]
      properties:
        babyId:
          type: string
        time:
          type: string
          format: date-time
        type:
          type: string
          enum: [wet, dirty, both]
        notes:
          type: string
          maxLength: 1000
    UpdateDiaper:
      type: object
      description: >-
        Every field is optional; an empty object is a no-op. `notes` may
        also be sent as `null` to CLEAR it; `time`/`type` are not nullable —
        only settable or omitted (see internal/api/feeds.go for the
        presence-detection pattern this endpoint shares with UpdateFeed).
      properties:
        time:
          type: string
          format: date-time
        type:
          type: string
          enum: [wet, dirty, both]
        notes:
          type: string
          maxLength: 1000
          nullable: true
    SleepLog:
      type: object
      required:
        - id
        - babyId
        - caretakerId
        - caretakerName
        - notes
        - startTime
        - endTime
        - location
      properties:
        id:
          type: string
        babyId:
          type: string
        caretakerId:
          type: string
        caretakerName:
          type: string
        notes:
          type: string
          nullable: true
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
          nullable: true
          description: null while the session is active.
        location:
          type: string
          nullable: true
    CreateSleep:
      type: object
      required: [babyId, startTime]
      properties:
        babyId:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
          description: Omit to start an active sleep session.
        location:
          type: string
          maxLength: 100
        notes:
          type: string
          maxLength: 1000
    UpdateSleep:
      type: object
      description: >-
        Every field is optional; an empty object is a no-op. `endTime`,
        `location` and `notes` may also be sent as `null` to CLEAR that
        column — clearing `endTime` reopens the session and can 409 if
        another session for the same baby is already active (see
        internal/api/sleep.go). `startTime` is not nullable — only settable
        or omitted.
      properties:
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
          nullable: true
        location:
          type: string
          maxLength: 100
          nullable: true
        notes:
          type: string
          maxLength: 1000
          nullable: true
    Wake:
      type: object
      description: Defaults endTime to now on the server when omitted.
      properties:
        endTime:
          type: string
          format: date-time
    SleepLocation:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    CreateSleepLocation:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
    PlayLog:
      type: object
      description: >-
        Timed activities (tummy time, walks, free play) — same session shape
        as SleepLog: startTime + nullable endTime, null meaning "still
        running". Free (no plan gate).
      required:
        - id
        - babyId
        - caretakerId
        - caretakerName
        - notes
        - type
        - startTime
        - endTime
      properties:
        id:
          type: string
        babyId:
          type: string
        caretakerId:
          type: string
        caretakerName:
          type: string
        notes:
          type: string
          nullable: true
        type:
          type: string
          enum: [tummy, walk, play]
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
          nullable: true
          description: null while the activity is running.
    CreatePlay:
      type: object
      required: [babyId, type, startTime]
      properties:
        babyId:
          type: string
        type:
          type: string
          enum: [tummy, walk, play]
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
          nullable: true
          description: Omit to start a running session.
        notes:
          type: string
          maxLength: 2000
    UpdatePlay:
      type: object
      description: >-
        Every field is optional; an empty object is a no-op. `endTime` and
        `notes` may also be sent as `null` to CLEAR that column — clearing
        `endTime` reopens the session and can 409 if another session for
        the same baby is already running (see internal/api/play.go).
        `type`/`startTime` are not nullable — only settable or omitted.
      properties:
        type:
          type: string
          enum: [tummy, walk, play]
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          maxLength: 2000
          nullable: true
    StopPlay:
      type: object
      description: Defaults endTime to now on the server when omitted.
      properties:
        endTime:
          type: string
          format: date-time
    Summary:
      type: object
      required:
        - lastFeed
        - lastDiaper
        - activeSleep
        - lastSleep
        - activePlay
        - today
      properties:
        lastFeed:
          allOf:
            - $ref: "#/components/schemas/FeedLog"
          nullable: true
        lastDiaper:
          allOf:
            - $ref: "#/components/schemas/DiaperLog"
