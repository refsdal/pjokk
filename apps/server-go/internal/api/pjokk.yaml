openapi: 3.0.3
info:
  title: Pjokk API
  description: >-
    Pjokk is a self-hosted baby tracker for families. This spec is the single
    source of truth for the Go server's HTTP surface: it drives runtime
    request validation (kin-openapi nethttp-middleware), the generated
    strict-server routes and types (oapi-codegen), and the interactive docs
    served at /api/docs (Scalar, reading /api/openapi.json — this file,
    converted to JSON at runtime).
  version: "1.0.0"
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: healthz
      summary: Liveness probe. Touches nothing — not even the database pool.
      tags: [system]
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
  /readyz:
    get:
      operationId: readyz
      summary: Readiness probe. Runs `SELECT 1` against the database pool.
      tags: [system]
      responses:
        "200":
          description: The process is ready to serve traffic.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
        "503":
          description: The database is unreachable.
          content:
            application/json:
              schema:
                type: object
                required: [ok, error]
                properties:
                  ok:
                    type: boolean
                    enum: [false]
                  error:
                    type: string

  /api/babies:
    get:
      operationId: listBabies
      summary: Babies in the caller's active family, oldest first.
      tags: [babies]
      responses:
        "200":
          description: Babies in the active family.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Baby"
    post:
      operationId: createBaby
      summary: Create a baby in the caller's active family. Free — no plan gate.
      tags: [babies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBaby"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Baby"
  /api/babies/{id}:
    patch:
      operationId: updateBaby
      summary: >-
        Partial update. An empty body is a no-op that returns the baby
        unchanged.
      tags: [babies]
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBaby"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Baby"
        "404":
          description: No baby with this id in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteBaby
      summary: >-
        Family-admin only. Deletes the baby and EVERY log for them
        (cascade).
      tags: [babies]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "403":
          description: Family admin only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No baby with this id in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/family:
    get:
      operationId: getFamily
      summary: The caller's active family.
      tags: [family]
      responses:
        "200":
          description: The active family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"
        "404":
          description: Family missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/family/members:
    get:
      operationId: listFamilyMembers
      summary: Caretakers in the caller's active family.
      tags: [family]
      responses:
        "200":
          description: Caretakers in the family.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
  /api/family/members/{memberId}:
    delete:
      operationId: deleteFamilyMember
      summary: Remove a member from the caller's active family. Family-admin only.
      tags: [family]
      parameters:
        - $ref: "#/components/parameters/memberIdPath"
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "403":
          description: Family admin only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such member in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/family/members/{memberId}/role:
    post:
      operationId: setFamilyMemberRole
      summary: Change a member's role in the caller's active family. Family-admin only.
      tags: [family]
      parameters:
        - $ref: "#/components/parameters/memberIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMemberRole"
      responses:
        "200":
          description: Role changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "403":
          description: Family admin only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such member in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/feeds:
    get:
      operationId: listFeeds
      summary: Feed logs in the caller's active family, newest first.
      tags: [feeds]
      parameters:
        - $ref: "#/components/parameters/babyIdQuery"
        - $ref: "#/components/parameters/limitQuery"
      responses:
        "200":
          description: Feed logs, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedLog"
    post:
      operationId: createFeed
      summary: Log a feed for a baby in the caller's active family.
      tags: [feeds]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFeed"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedLog"
        "404":
          description: Unknown baby.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/feeds/{id}:
    patch:
      operationId: updateFeed
      summary: >-
        Partial update. A field sent as `null` clears the column; an
        omitted field is left unchanged; an empty body is a no-op that
        returns the feed unchanged. `time`/`type` are not nullable — only
        settable or omitted. See internal/api/feeds.go for how this
        endpoint tells "omitted" apart from "null" (the generated request
        type alone cannot).
      tags: [feeds]
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFeed"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedLog"
        "404":
          description: No feed with this id in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteFeed
      summary: Delete a feed log.
      tags: [feeds]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "404":
          description: No feed with this id in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/diapers:
    get:
      operationId: listDiapers
      summary: Diaper logs in the caller's active family, newest first.
      tags: [diapers]
      parameters:
        - $ref: "#/components/parameters/babyIdQuery"
        - $ref: "#/components/parameters/limitQuery"
      responses:
        "200":
          description: Diaper logs, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiaperLog"
    post:
      operationId: createDiaper
      summary: Log a diaper change for a baby in the caller's active family.
      tags: [diapers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDiaper"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiaperLog"
        "404":
          description: Unknown baby.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/diapers/{id}:
    patch:
      operationId: updateDiaper
      summary: >-
        Partial update. A field sent as `null` clears the column; an
        omitted field is left unchanged; an empty body is a no-op that
        returns the diaper log unchanged. `time`/`type` are not nullable —
        only settable or omitted. See internal/api/feeds.go for how this
        endpoint tells "omitted" apart from "null" (the generated request
        type alone cannot).
      tags: [diapers]
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDiaper"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiaperLog"
        "404":
          description: No diaper log with this id in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteDiaper
      summary: Delete a diaper log.
      tags: [diapers]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "404":
          description: No diaper log with this id in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/sleep:
    get:
      operationId: listSleeps
      summary: Sleep logs in the caller's active family, newest first (by startTime).
      tags: [sleep]
      parameters:
        - $ref: "#/components/parameters/babyIdQuery"
        - $ref: "#/components/parameters/limitQuery"
      responses:
        "200":
          description: Sleep logs, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SleepLog"
    post:
      operationId: createSleep
      summary: >-
        Create a sleep log. Omit endTime to start an active session; a baby
        can only have one active session at a time — enforced by a partial
        unique index (see internal/api/sleep.go), not just the pre-check
        this endpoint also does.
      tags: [sleep]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSleep"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SleepLog"
        "404":
          description: Unknown baby.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Baby already has an active session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sleep/active:
    get:
      operationId: getActiveSleep
      summary: The active sleep session for a baby, or null.
      tags: [sleep]
      parameters:
        - $ref: "#/components/parameters/babyIdQuery"
      responses:
        "200":
          description: The active sleep session, or null.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SleepLog"
                nullable: true
  /api/sleep/{id}/wake:
    post:
      operationId: wakeSleep
      summary: End the active session for a sleep log. endTime defaults to now.
      tags: [sleep]
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Wake"
      responses:
        "200":
          description: Session ended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SleepLog"
        "404":
          description: No such active session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sleep/{id}:
    patch:
      operationId: updateSleep
      summary: >-
        Partial update. `endTime` sent as `null` CLEARS it, reopening the
        session — subject to the same one-active-session-per-baby
        constraint as create, so this can also 409. `location`/`notes` may
        also be sent as `null` to clear them; `startTime` is not nullable —
        only settable or omitted. See internal/api/feeds.go for the
        omitted-vs-null presence-detection pattern this endpoint needs.
      tags: [sleep]
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSleep"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SleepLog"
        "404":
          description: No sleep log with this id in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            Clearing endTime would reopen a session while another is
            already active for this baby.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteSleep
      summary: Delete a sleep log.
      tags: [sleep]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "404":
          description: No sleep log with this id in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/sleep-locations:
    get:
      operationId: listSleepLocations
      summary: Custom sleep-location chips for the caller's active family.
      tags: [sleep-locations]
      responses:
        "200":
          description: Custom sleep locations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SleepLocation"
    post:
      operationId: createSleepLocation
      summary: >-
        Family-admin only; not available to API keys. Rejects a name that
        duplicates a default chip or an existing custom one
        (case-insensitive), and caps custom locations at 20 per family.
      tags: [sleep-locations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSleepLocation"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SleepLocation"
        "403":
          description: Family admin only, or an API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Duplicate name or limit reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sleep-locations/{id}:
    delete:
      operationId: deleteSleepLocation
      summary: Family-admin only; not available to API keys.
      tags: [sleep-locations]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "403":
          description: Family admin only, or an API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such location in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/summary:
    get:
      operationId: getSummary
      summary: >-
        Everything the home screen needs in one call: last feed, last
        diaper, active + last sleep, active play, and today's local-day
        totals.
      tags: [summary]
      parameters:
        - name: babyId
          in: query
          required: true
          schema:
            type: string
        - name: tz
          in: query
          required: false
          description: >-
            The requester's Date.getTimezoneOffset() (minutes,
            UTC-minus-local). The `today` block follows the caretaker's
            clock, not the server's. Defaults to 0 (UTC) when omitted.
          schema:
            type: integer
            minimum: -840
            maximum: 840
            default: 0
      responses:
        "200":
          description: Status summary for a baby.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Summary"
        "404":
          description: Unknown baby.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/medicine:
    get:
      operationId: listMedicine
      summary: Medicine logs in the caller's active family, newest first.
      tags: [medicine]
      parameters:
        - $ref: "#/components/parameters/babyIdQuery"
        - $ref: "#/components/parameters/limitQuery"
      responses:
        "200":
          description: Medicine logs, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MedicineLog"
    post:
      operationId: createMedicine
      summary: Log a medicine dose for a baby in the caller's active family.
      tags: [medicine]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMedicine"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicineLog"
        "404":
          description: Unknown baby.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/medicine/{id}:
    patch:
      operationId: updateMedicine
      summary: >-
        Partial update. `amount`, `unit` and `notes` may be sent as `null`
        to CLEAR that column; `time`/`name` are not nullable — only settable
        or omitted. An empty body is a no-op. See internal/api/feeds.go for
        the omitted-vs-null presence-detection pattern this endpoint needs.
      tags: [medicine]
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMedicine"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicineLog"
        "404":
          description: No medicine log with this id in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteMedicine
      summary: Delete a medicine log.
      tags: [medicine]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "404":
          description: No medicine log with this id in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/baths:
    get:
      operationId: listBaths
      summary: Bath logs in the caller's active family, newest first.
      tags: [baths]
      parameters:
        - $ref: "#/components/parameters/babyIdQuery"
        - $ref: "#/components/parameters/limitQuery"
      responses:
        "200":
          description: Bath logs, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BathLog"
    post:
      operationId: createBath
      summary: Log a bath for a baby in the caller's active family.
      tags: [baths]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBath"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BathLog"
        "404":
          description: Unknown baby.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/baths/{id}:
    patch:
      operationId: updateBath
      summary: >-
        Partial update. `notes` may be sent as `null` to CLEAR it; `time`
        is not nullable — only settable or omitted. An empty body is a
        no-op. See internal/api/feeds.go for the omitted-vs-null
        presence-detection pattern this endpoint needs.
      tags: [baths]
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBath"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BathLog"
        "404":
          description: No bath log with this id in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteBath
      summary: Delete a bath log.
      tags: [baths]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "404":
          description: No bath log with this id in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/notes:
    get:
      operationId: listNotes
      summary: Note logs in the caller's active family, newest first.
      tags: [notes]
      parameters:
        - $ref: "#/components/parameters/babyIdQuery"
        - $ref: "#/components/parameters/limitQuery"
      responses:
        "200":
          description: Note logs, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NoteLog"
    post:
      operationId: createNote
      summary: Log a note for a baby in the caller's active family.
      tags: [notes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNote"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteLog"
        "404":
          description: Unknown baby.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/notes/{id}:
    patch:
      operationId: updateNote
      summary: >-
        Partial update. `notes` may be sent as `null` to CLEAR it; `time`
        and `content` are not nullable — only settable or omitted. An empty
        body is a no-op. See internal/api/feeds.go for the omitted-vs-null
        presence-detection pattern this endpoint needs.
      tags: [notes]
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNote"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteLog"
        "404":
          description: No note log with this id in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteNote
      summary: Delete a note log.
      tags: [notes]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: Deleted.
