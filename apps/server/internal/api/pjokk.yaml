  /api/timeline:
    get:
      operationId: listTimeline
      summary: >-
        The merged feed of everything, newest first. Sleep and play entries
        sort by their startTime (active sessions have endTime null); every
        other kind sorts by time. filter=other selects the eight non-core
        kinds (medicine, bath, note, milestone, measurement, pump, play,
        vaccine) together; omitting filter returns all eleven.
      tags: [timeline]
      parameters:
        - name: babyId
          in: query
          required: true
          schema:
            type: string
        - name: before
          in: query
          required: false
          description: >-
            Opaque keyset cursor from a previous page's nextCursor
            ("<epochMs>|<id>"). The id tiebreak keeps pagination lossless
            across equal timestamps.
          schema:
            type: string
            pattern: ^\d{1,15}\|.{1,64}$
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: filter
          in: query
          required: false
          schema:
            type: string
            enum: [feeds, diapers, sleep, other]
      responses:
        "200":
          description: Timeline page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timeline"
        "404":
          description: Unknown baby.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/stats:
    get:
      operationId: getStats
      summary: >-
        Per-day sleep/intake/counts plus averages for the window, and the
        latest weight with its predecessor. Sleep sessions are split across
        local midnights. Free for any window up to 90 days — the TS
        predecessor's statsMonth premium gate on days>7 is removed.
      tags: [stats]
      parameters:
        - name: babyId
          in: query
          required: true
          schema:
            type: string
        - name: days
          in: query
          required: false
          description: Window length in local days, today included.
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 7
        - name: tz
          in: query
          required: false
          description: >-
            The requester's Date.getTimezoneOffset() (minutes,
            UTC-minus-local). Day buckets follow the caretaker's clock, not
            the server's. Defaults to 0 (UTC) when omitted.
          schema:
            type: integer
            minimum: -840
            maximum: 840
            default: 0
      responses:
        "200":
          description: Stats for the window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"
        "404":
          description: Unknown baby.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/me:
    get:
      operationId: getMe
      summary: >-
        Session info for the SPA shell. Requires a session but NOT an
        active family — the family/member/plan fields are null when the
        caller has none.
      tags: [me]
      responses:
        "200":
          description: The caller's session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"

  /api/push/config:
    get:
      operationId: getPushConfig
      summary: >-
        The VAPID public key the frontend needs to create a browser push
        subscription. Never available to API keys (device/session-bound —
        see internal/api/middleware's RejectAPIKey).
      tags: [push]
      responses:
        "200":
          description: VAPID public key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushConfig"

  /api/push/subscribe:
    post:
      operationId: subscribePush
      summary: >-
        Register this browser's push subscription for the signed-in
        caretaker. Upserts by endpoint: re-subscribing the SAME endpoint
        rebinds it to the calling user/family and refreshes its keys rather
        than failing a uniqueness check. Rejects an endpoint whose host
        isn't one of the recognized push services, or that isn't https — see
        internal/api/push.go's isAllowedPushEndpoint (SSRF guard: the
        scheduler later POSTs to stored endpoints unattended).
      tags: [push]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Subscribe"
      responses:
        "200":
          description: Stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          description: Not a recognized push service endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/push/unsubscribe:
    post:
      operationId: unsubscribePush
      summary: >-
        Remove a subscription. Scoped to the caller's OWN rows — deleting by
        endpoint alone would let one caretaker remove another's
        subscription just by knowing the endpoint URL. Removing an endpoint
        that isn't the caller's (or doesn't exist) is still a 200: this is a
        set-membership operation, not a lookup.
      tags: [push]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Unsubscribe"
      responses:
        "200":
          description: Removed (if it was the caller's).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"

  /api/push/prefs:
    get:
      operationId: getPushPrefs
      summary: >-
        The caller's feed-reminder preference for the active family.
        Defaults to 0 (off) when no preference row exists yet.
      tags: [push]
      responses:
        "200":
          description: Notification preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushPrefs"
    put:
      operationId: updatePushPrefs
      summary: >-
        Set the caller's feed-reminder preference. Resets the reminder
        cooldown (last_reminded_at set to NULL) so a new setting starts a
        fresh observation window instead of firing immediately off the old
        one's state.
      tags: [push]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushPrefs"
      responses:
        "200":
          description: Updated preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushPrefs"

  /api/push/test:
    post:
      operationId: testPush
      summary: >-
        Send a test notification to every device the caller has subscribed,
        via Deps.Push.ToUser. Returns how many deliveries succeeded.
      tags: [push]
      responses:
        "200":
          description: Delivery count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushTestResult"

  /api/keys:
    get:
      operationId: listApiKeys
      summary: >-
        Bearer API keys for the family, newest first. The full key is never
        included — only createApiKey's response ever carries it. Family
        admin only; refused for API-key callers (Task 19).
      tags: [api-keys]
      responses:
        "200":
          description: Keys for the family, key material omitted.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKey"
    post:
      operationId: createApiKey
      summary: >-
        Create a bearer API key for integrations (Home Assistant, Grafana).
        The full key is returned ONCE and never again — use it as
        `Authorization: Bearer pjk_…`. Free (no plan gate — the TypeScript
        predecessor's apiKeys 402 is removed). Family admin only; refused
        for API-key callers.
      tags: [api-keys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKey"
      responses:
        "201":
          description: Created — copy the key now, it is never shown again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreated"
  /api/keys/{id}:
    delete:
      operationId: revokeApiKey
      summary: >-
        Revoke a key: sets revoked_at rather than deleting the row, so a
        revoked key becomes indistinguishable from one that never existed to
        APIKeyAuth (which filters on revoked_at IS NULL) while its audit
        trail (name, createdBy, createdAt) survives. Family admin only;
        refused for API-key callers.
      tags: [api-keys]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "404":
          description: No key with this id in the caller's family, or already revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/invites:
    get:
      operationId: listInvites
      summary: >-
        Invite codes ever issued for the family, newest first — used and
        revoked ones included. Family admin only.
      tags: [invites]
      responses:
        "200":
          description: Invites for the family.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invite"
    post:
      operationId: createInvite
      summary: >-
        Mint an invite code (QR-at-Sunday-dinner grain: codes are shared
        aloud or by QR, not email-addressed like Limen's own organization
        invitations). Family admin only.
      tags: [invites]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvite"
      responses:
        "201":
          description: Created invite code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
  /api/invites/{code}:
    delete:
      operationId: revokeInvite
      summary: >-
        Revoke a code (sets revokedAt) so it can no longer be redeemed.
        Family admin only.
      tags: [invites]
      parameters:
        - $ref: "#/components/parameters/codePath"
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "404":
          description: No such code in the caller's family, or already revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/invites/info/{code}:
    get:
      operationId: getInviteInfo
      summary: >-
        What the /join page shows before sign-in: which family, which
        role, still valid? No session required. Codes are credentials, so
        this is rate-limited: 30/10min per client plus a 500/10min global
        backstop against distributed guessing.
      tags: [invites]
      parameters:
        - $ref: "#/components/parameters/codePath"
      responses:
        "200":
          description: Invite status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteInfo"
  /api/invites/redeem:
    post:
      operationId: redeemInvite
      summary: >-
        Join a family with an invite code. Requires a signed-in session —
        no active family required, since this IS how one is acquired.
        Membership and the code's use-count are written atomically in one
        transaction. Rate-limited: 10/10min per client plus a 200/10min
        global backstop.
      tags: [invites]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Redeem"
      responses:
        "200":
          description: Joined (or already a member).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedeemResult"
        "400":
          description: Invalid, expired, exhausted, or revoked code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # --- System-admin console (Task 21; REF §A1 admin.ts) -------------------
  # Every operation below runs behind RequireSysadmin (users.role ==
  # "admin", a column of ours unrelated to the per-family admin role) and
  # is refused outright for API-key callers — EXCEPT
  # /api/admin/stop-impersonating, which is deliberately session-level;
  # see its own summary.
  /api/admin/stats:
    get:
      operationId: getAdminStats
      summary: >-
        Platform totals for the /admin dashboard. coreLogs is feeds +
        diapers + sleeps; usersLast7d counts accounts created in the last
        seven days. System admin only.
      tags: [admin]
      responses:
        "200":
          description: Platform totals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
  /api/admin/families:
    get:
      operationId: listAdminFamilies
      summary: >-
        Every family on the platform, newest first, with member and baby
        counts and the timestamp of its most recent feed (null when it has
        never logged one). System admin only.
      tags: [admin]
      responses:
        "200":
          description: All families.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminFamily"
  /api/admin/families/{id}:
    delete:
      operationId: deleteAdminFamily
      summary: >-
        Delete a family and ALL its data — members, babies, invites, keys
        and every log cascade with the organization row. Audited as
        `family.delete` before the delete runs. System admin only.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "404":
          description: No family with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/users:
    get:
      operationId: listAdminUsers
      summary: >-
        Accounts on the platform, newest first. `query` filters on name or
        email (case-insensitive substring). NEW in Go — replaces the
        better-auth admin plugin's client-side listUsers call. System admin
        only.
      tags: [admin]
      parameters:
        - name: query
          in: query
          description: Case-insensitive substring match on name or email.
          required: false
          schema:
            type: string
            maxLength: 200
        - $ref: "#/components/parameters/limitQuery"
      responses:
        "200":
          description: Matching accounts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
  /api/admin/users/{id}/delete:
    post:
      operationId: deleteAdminUser
      summary: >-
        Delete an account safely. Every non-cascading reference to the user
        (log attribution on all eleven log kinds, vaccine documents and
        dismissals, invites, API keys, calendar events and audit rows) is
        reassigned to the tombstone "Deleted user" in ONE transaction,
        calendar assignments are dropped, the user's API keys are revoked,
        and only then is the account removed
        (sessions, memberships and push subscriptions cascade). POST rather
        than DELETE, matching the TypeScript predecessor's route. Audited
        as `user.delete`. System admin only.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          description: Refused — the caller's own account, or the tombstone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No user with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/users/{id}/ban:
    post:
      operationId: banAdminUser
      summary: >-
        Ban an account: sets banned + ban_reason AND revokes every session
        the user holds, so the ban is enforced by absence rather than by
        every reader remembering to check a flag. Their API keys stop
        authenticating too (GetAPIKeyByHash joins on a non-banned creator).
        Audited as `user.ban`. System admin only.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BanUser"
      responses:
        "200":
          description: Banned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          description: Refused — an admin may not ban their own account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No user with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/users/{id}/unban:
    post:
      operationId: unbanAdminUser
      summary: >-
        Lift a ban: clears banned + ban_reason. Sessions revoked by the ban
        stay revoked — the user signs in again. Audited as `user.unban`.
        System admin only.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: Unbanned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "404":
          description: No user with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/users/{id}/password:
    post:
      operationId: setAdminUserPassword
      summary: >-
        Set a user's password (support flow — also establishes a first
        password for an account created through the invite flow with no
        credential). The password itself is NEVER written to the audit
        trail; the row records only the user id. Audited as
        `user.password.set`. System admin only.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetUserPassword"
      responses:
        "200":
          description: Password set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          description: >-
            The password does not meet the credential policy. `minLength`
            below is checked before the handler runs; the rest of the
            policy (an uppercase letter and a number, per Limen's
            configured defaults) cannot be expressed as a JSON-Schema
            constraint and is reported here, with the same VALIDATION code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No user with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/users/{id}/sessions/revoke:
    post:
      operationId: revokeAdminUserSessions
      summary: >-
        Sign a user out everywhere. Audited as `user.sessions.revoke`.
        System admin only.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: Sessions revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "404":
          description: No user with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/users/{id}/impersonate:
    post:
      operationId: impersonateAdminUser
      summary: >-
        Sign in as another user for support. Mints a session for the target
        carrying the admin's id in its metadata (the in-app banner reads
        it) and swaps the session cookie over; the admin's own session is
        kept, and POST /api/admin/stop-impersonating restores it. Refused
        for the caller's own account and for banned targets. Audited as
        `user.impersonate` against the REAL admin. System admin only.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: Impersonating — the response carries the target's session cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          description: >-
            Refused — the caller's own account, a banned target, or a
            caller who is themselves being impersonated (impersonation
            cannot be chained).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No user with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/stop-impersonating:
    post:
      operationId: stopImpersonating
      summary: >-
        End an impersonation and restore the admin's own session cookie.
        Deliberately session-level, NOT system-admin-gated: while
        impersonating an ordinary user the current session IS that user's,
        so a sysadmin gate would trap the operator inside the impersonated
        session. A caller who is not impersonating gets 400
        NOT_IMPERSONATING — which is all an ordinary user can ever reach
        here. Audited as `impersonation.stop` against the real admin.
      tags: [admin]
      responses:
        "200":
          description: Impersonation ended — the response restores the admin's cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          description: This session is not impersonating anyone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/audit:
    get:
      operationId: listAdminAudit
      summary: >-
        The 100 most recent entries in the append-only system-admin trail,
        newest first. System admin only.
      tags: [admin]
      responses:
        "200":
          description: Recent admin actions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEntry"
    post:
      operationId: createAdminAuditNote
      summary: >-
        Append an entry to the trail by hand, for an admin action performed
        outside these routes. System admin only.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditNote"
      responses:
        "200":
          description: Recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"

components:
  parameters:
    babyIdQuery:
      name: babyId
      in: query
      description: Restrict the result to one baby in the caller's family.
      required: false
      schema:
        type: string
    limitQuery:
      name: limit
      in: query
      description: Maximum number of rows to return.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
    idPath:
      name: id
      in: path
      description: Resource id.
      required: true
      schema:
        type: string
    memberIdPath:
      name: memberId
      in: path
      description: The family-membership row id (NOT the user id).
      required: true
      schema:
        type: string
    codePath:
      name: code
      in: path
      description: An invite code.
      required: true
      schema:
        type: string
  schemas:
    Ok:
      type: object
      description: The standard `{ok:true}` success body for actions with no other payload.
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]
    Baby:
      type: object
      required: [id, name, birthDate, sex]
      properties:
        id:
          type: string
        name:
          type: string
        birthDate:
          type: string
          format: date-time
        sex:
          type: string
          enum: [girl, boy]
          nullable: true
      x-go-name: Baby
    CreateBaby:
      type: object
      required: [name, birthDate]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        birthDate:
          type: string
          format: date-time
        sex:
          type: string
          enum: [girl, boy]
    UpdateBaby:
      type: object
      description: >-
        Every field is optional; an empty object is a no-op. `sex` may also
        be sent as `null`, which — like omitting it — leaves the baby's sex
        unchanged (Go's JSON decoding cannot tell "absent" from "null" for a
        nullable-optional field without a bespoke wrapper type, and no
        caller needs to clear sex back to unknown today; see
        internal/api/babies.go).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        birthDate:
          type: string
          format: date-time
        sex:
          type: string
          enum: [girl, boy]
          nullable: true
    Member:
      type: object
      required: [memberId, userId, name, email, role, image]
      properties:
        memberId:
          type: string
          description: The family-membership row id (NOT the user id).
        userId:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
        image:
          type: string
          nullable: true
    Family:
      type: object
      required: [id, name, slug, plan]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        plan:
          type: string
    SetMemberRole:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, member]
    Me:
      type: object
      description: >-
        familyId/memberRole/plan/impersonatedBy are null when the caller has
        no active family (or, for impersonatedBy, is not impersonated).
      required:
        [userId, name, email, role, familyId, memberRole, plan, impersonatedBy]
      properties:
        userId:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          nullable: true
          description: Ours, system-admin role. "admin" or null.
        familyId:
          type: string
          nullable: true
        memberRole:
          type: string
          nullable: true
        plan:
          type: string
          nullable: true
        impersonatedBy:
          type: string
          nullable: true
    FeedLog:
      type: object
      required:
        - id
        - babyId
        - caretakerId
        - caretakerName
        - notes
        - time
        - type
        - amountMl
        - side
        - durationMin
        - leftMin
        - rightMin
      properties:
        id:
          type: string
        babyId:
          type: string
        caretakerId:
          type: string
        caretakerName:
          type: string
        notes:
          type: string
          nullable: true
        time:
          type: string
          format: date-time
        type:
          type: string
          enum: [bottle, breast, solids]
        amountMl:
          type: integer
