    TimelineEntry:
      type: object
      description: >-
        One row in the merged timeline. `kind`, `id`, `babyId`,
        `caretakerId`, `caretakerName` and `notes` are present on every
        entry regardless of kind; everything else is kind-specific and only
        present for the kinds that have it (e.g. `startTime`/`endTime` on
        sleep and play, `time` on the other nine, `documents` only on
        vaccine) — see internal/api/timeline.go's per-kind entry builders,
        ported field-for-field from apps/api/src/routes/timeline.ts's merge.
        Modeled as an open object (kind + a handful of always-present fields
        typed, everything else additionalProperties) rather than a oneOf
        discriminated union: oapi-codegen has no clean Go representation for
        eleven structurally different variants sharing one JSON shape.
      required: [kind, id, babyId, caretakerId, caretakerName, notes]
      properties:
        kind:
          type: string
          enum:
            - feed
            - diaper
            - sleep
            - medicine
            - bath
            - note
            - milestone
            - measurement
            - pump
            - play
            - vaccine
        id:
          type: string
        babyId:
          type: string
        caretakerId:
          type: string
        caretakerName:
          type: string
        notes:
          type: string
          nullable: true
      additionalProperties: true
    StatsDay:
      type: object
      required: [date, sleepMin, nightSleepMin, intakeMl, feeds, feedsByType, diapers]
      properties:
        date:
          type: string
          description: YYYY-MM-DD in the requester's local time.
        sleepMin:
          type: integer
          format: int32
        nightSleepMin:
          type: integer
          format: int32
          description: The part of sleepMin from sessions typed `night` (issue #50).
        feedsByType:
          $ref: "#/components/schemas/StatsFeedsByType"
        intakeMl:
          type: integer
          format: int32
        feeds:
          type: integer
          format: int32
        diapers:
          type: integer
          format: int32
    StatsWeight:
      type: object
      required: [value, time, prevValue, prevTime]
      properties:
        value:
          type: number
          format: double
        time:
          type: string
          format: date-time
        prevValue:
          type: number
          format: double
          nullable: true
        prevTime:
          type: string
          format: date-time
          nullable: true
    StatsNight:
      type: object
      description: >-
        One night of the window (issue #50). A `night` sleep session belongs
        to the night it STARTED in, where night D runs from local noon on
        day D to local noon on D+1 — so a 23:00 bedtime and a 02:00 resettle
        land on the same night, and this morning's wake-up closes "last
        night". Both values are null for a night with no night session.
        Like the day buckets, the noon boundary is a fixed offset from the
        caretaker's `tz` and does not follow a DST change inside the window.
      required: [date, longestStretchMin, wakings]
      properties:
        date:
          type: string
          description: Local calendar date the night began on (YYYY-MM-DD).
        longestStretchMin:
          type: integer
          format: int32
          nullable: true
          description: The longest single night session; a running one counts up to now.
        wakings:
          type: integer
          format: int32
          nullable: true
          description: Night sessions minus one.
    StatsFeedsByType:
      type: object
      required: [bottle, breast, solids]
      properties:
        bottle:
          type: number
          format: double
        breast:
          type: number
          format: double
        solids:
          type: number
          format: double
    Stats:
      type: object
      required:
        - days
        - nights
        - avgSleepMin
        - avgNightSleepMin
        - avgNapMin
        - avgNaps
        - avgIntakeMl
        - avgFeeds
        - avgFeedsByType
        - avgDiapers
        - weight
      properties:
        days:
          type: array
          items:
            $ref: "#/components/schemas/StatsDay"
        nights:
          type: array
          description: >-
            One entry per local day of the window plus the day before it
            (oldest first): the night that began on each. The extra night
            is what lets a one-day window still answer "last night".
          items:
            $ref: "#/components/schemas/StatsNight"
        avgSleepMin:
          type: integer
          format: int32
        avgNightSleepMin:
          type: integer
          format: int32
          description: >-
            Per day, minutes of sessions typed `night`; the rest of
            avgSleepMin is day sleep (naps and untyped sessions).
        avgNapMin:
          type: integer
          format: int32
          description: >-
            The mean length of ONE nap, where a nap is any session not
            typed `night` (the same split as avgNightSleepMin). Unlike the
            day buckets, which cut a session at local midnight, this counts
            whole sessions and assigns each to the window by its START
            time; a running nap has no length yet and is excluded. 0 when
            no nap ended inside the window.
        avgNaps:
          type: number
          format: double
          description: >-
            Naps per day over the whole window (the denominator is the
            window length, as for avgFeeds), counting the same completed
            sessions as avgNapMin.
        avgFeedsByType:
          $ref: "#/components/schemas/StatsFeedsByType"
        avgIntakeMl:
          type: integer
          format: int32
        avgFeeds:
          type: number
          format: double
        avgDiapers:
          type: number
          format: double
        weight:
          allOf:
            - $ref: "#/components/schemas/StatsWeight"
          nullable: true
    Timeline:
      type: object
      required: [entries, nextCursor]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/TimelineEntry"
        nextCursor:
          type: string
          nullable: true
          description: >-
            Opaque keyset cursor ("<epochMs>|<id>"); pass back as ?before=
            for the next (older) page. Null when there is no further page.
    HelpRequest:
      type: object
      description: >-
        One caretaker asking a specific other member of the family for a
        hand. Family state, not a log: it is not on the timeline and has no
        baby. Open until someone acknowledges it; shown on Home (see
        Summary.openHelp) for two hours after creation whatever its state,
        then simply no longer returned. Names are denormalised so the card
        never needs a second lookup and still reads correctly after a
        member leaves.
      required:
        - id
        - fromUserId
        - fromName
        - toUserId
        - toName
        - message
        - createdAt
        - acknowledgedAt
        - acknowledgedByName
        - delivered
      properties:
        id:
          type: string
        fromUserId:
          type: string
        fromName:
          type: string
          description: The sender's display name, '' if they have none.
        toUserId:
          type: string
        toName:
          type: string
        message:
          type: string
          description: "'' when the sender sent none."
        createdAt:
          type: string
          format: date-time
        acknowledgedAt:
          type: string
          format: date-time
          nullable: true
          description: null while open.
        acknowledgedByName:
          type: string
          nullable: true
          description: Who answered ('' if nameless); null while open.
        delivered:
          type: integer
          description: >-
            Devices the creation push reached. Only meaningful on the
            createHelpRequest response; every other place that returns a
            HelpRequest sets it to 0.
    CreateHelpRequest:
      type: object
      required: [memberId]
      properties:
        memberId:
          type: string
          description: The target's family-membership id (Member.memberId).
        message:
          type: string
          maxLength: 200
    Summary:
      type: object
      required:
        - lastFeed
        - lastDiaper
        - activeSleep
        - lastSleep
        - lastNightMin
        - activePlay
        - activeFeed
        - activePump
        - lastTemperature
        - openHelp
        - today
      properties:
        lastFeed:
          allOf:
            - $ref: "#/components/schemas/FeedLog"
          nullable: true
        lastDiaper:
          allOf:
            - $ref: "#/components/schemas/DiaperLog"
          nullable: true
        activeSleep:
          allOf:
            - $ref: "#/components/schemas/SleepLog"
          nullable: true
        lastSleep:
          allOf:
            - $ref: "#/components/schemas/SleepLog"
          nullable: true
        lastNightMin:
          type: integer
          format: int32
          nullable: true
          description: >-
            Minutes asleep last night: every completed `night` session of
            the newest completed night, where a night runs from local noon
            to noon and a session belongs to the night it started in (the
            rule StatsNight uses), so a real waking does not shrink the
            night to its last stretch. Null when there is no completed
            night session, or the newest one ended more than 24 hours ago.
            A running night has no length yet and is ignored.
        activePlay:
          allOf:
            - $ref: "#/components/schemas/PlayLog"
          nullable: true
        activeFeed:
          description: The running nursing timer, or null (issue #44).
          allOf:
            - $ref: "#/components/schemas/FeedTimer"
          nullable: true
        activePump:
          description: The running pump timer, or null.
          allOf:
            - $ref: "#/components/schemas/FeedTimer"
          nullable: true
        lastTemperature:
          description: >-
            The newest `temperature` measurement, or null. Specifically the
            newest of that TYPE, not the newest measurement — a weight taken
            after a temperature must not displace it. Backs the Home screen's
            temperature card.
          allOf:
            - $ref: "#/components/schemas/MeasurementLog"
          nullable: true
        openHelp:
          description: >-
            The family's newest help request created within the last two
            hours, open or acknowledged, or null. Family-level (not per
            baby) but carried here because Home already polls this query.
          allOf:
            - $ref: "#/components/schemas/HelpRequest"
          nullable: true
        today:
          type: object
          required: [feeds, intakeMl, solidsG, wet, dirty, both, dry, sleepMin, sleeps, naps, napMin]
          properties:
            feeds:
              type: integer
              format: int32
            intakeMl:
              type: integer
              format: int32
            solidsG:
              type: integer
              format: int32
            wet:
              type: integer
              format: int32
            dirty:
              type: integer
              format: int32
            both:
              type: integer
              format: int32
            dry:
              type: integer
              format: int32
            sleepMin:
              type: integer
              format: int32
            sleeps:
              type: integer
              format: int32
              description: >-
                Sleep sessions with any part inside today's window, on the
                same rule sleepMin uses for minutes — an overnight sleep that
                ended this morning counts, a running one counts already.
            naps:
              type: integer
              format: int32
              description: >-
                Of `sleeps`, the sessions NOT typed `night` — naps and
                untyped sessions (the two-tap happy path), the same split
                /api/stats uses for avgNaps. Backs the Home screen's
                "2 naps · 1:45 today".
            napMin:
              type: integer
              format: int32
              description: >-
                Of `sleepMin`, the minutes of those same sessions, clipped to
                today's window on the same rule.
