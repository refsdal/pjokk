        presence-detection pattern this endpoint needs).
      properties:
        time:
          type: string
          format: date-time
        side:
          type: string
          enum: [left, right, both]
          nullable: true
        amountMl:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000
          nullable: true
        durationMin:
          type: integer
          format: int32
          minimum: 0
          maximum: 600
          nullable: true
        notes:
          type: string
          maxLength: 1000
          nullable: true
    CalendarEvent:
      type: object
      description: >-
        A family-wide (or baby-specific) planned event. Free (no plan
        gate — creation was premium in the TS predecessor; this port
        removes that gate).
      required:
        - id
        - title
        - description
        - location
        - category
        - startTime
        - allDay
        - durationMin
        - remindMinutesBefore
        - createdBy
        - createdByName
        - babies
        - assignees
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        category:
          type: string
          enum: [doctor, vaccination, babysitting, family, other]
        startTime:
          type: string
          format: date-time
        allDay:
          type: boolean
        durationMin:
          type: integer
          format: int32
          nullable: true
        remindMinutesBefore:
          type: integer
          format: int32
          nullable: true
        createdBy:
          type: string
        createdByName:
          type: string
        babies:
          type: array
          description: Zero babies = family-wide event.
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
              name:
                type: string
        assignees:
          type: array
          items:
            type: object
            required: [userId, name]
            properties:
              userId:
                type: string
              name:
                type: string
    CreateCalendarEvent:
      type: object
      required: [title, startTime]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        location:
          type: string
          maxLength: 200
        category:
          type: string
          enum: [doctor, vaccination, babysitting, family, other]
          default: other
        startTime:
          type: string
          format: date-time
        allDay:
          type: boolean
          default: false
          description: All-day events are single-day; the server nulls durationMin when set.
        durationMin:
          type: integer
          format: int32
          minimum: 5
          maximum: 1440
        remindMinutesBefore:
          type: integer
          format: int32
          minimum: 15
          maximum: 10080
        babyIds:
          type: array
          maxItems: 10
          default: []
          items:
            type: string
        assigneeUserIds:
          type: array
          maxItems: 20
          default: []
          items:
            type: string
    UpdateCalendarEvent:
      type: object
      description: >-
        Every field is optional; an empty object is a no-op.
        `description`/`location`/`durationMin`/`remindMinutesBefore` may
        also be sent as `null` to CLEAR that column; `title`/`category`/
        `startTime`/`allDay` are not nullable — only settable or omitted.
        `babyIds`/`assigneeUserIds`, when present, REPLACE the link set;
        omitted leaves it untouched (see internal/api/calendar.go).
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
          nullable: true
        location:
          type: string
          maxLength: 200
          nullable: true
        category:
          type: string
          enum: [doctor, vaccination, babysitting, family, other]
        startTime:
          type: string
          format: date-time
        allDay:
          type: boolean
        durationMin:
          type: integer
          format: int32
          minimum: 5
          maximum: 1440
          nullable: true
        remindMinutesBefore:
          type: integer
          format: int32
          minimum: 15
          maximum: 10080
          nullable: true
        babyIds:
          type: array
          maxItems: 10
          items:
            type: string
        assigneeUserIds:
          type: array
          maxItems: 20
          items:
            type: string
    Contact:
      type: object
      description: >-
        One entry in the family's address book. Zero linked babies means
        the contact belongs to the whole family. Free (no plan gate — see
        internal/api/contacts.go).
      required:
        - id
        - name
        - role
        - icon
        - phone
        - email
        - website
        - notes
        - babies
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
          nullable: true
        icon:
          type: string
          enum:
            [
              user,
              doctor,
              nurse,
              hospital,
              dental,
              family,
              grandparent,
              daycare,
              friend,
              phone,
            ]
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        babies:
          type: array
          description: Zero babies = a contact the whole family shares.
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
              name:
                type: string
    CreateContact:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        role:
          type: string
          maxLength: 60
        icon:
          type: string
          enum:
            [
              user,
              doctor,
              nurse,
              hospital,
              dental,
              family,
              grandparent,
              daycare,
              friend,
              phone,
            ]
        phone:
          type: string
          maxLength: 40
        email:
          type: string
          format: email
          maxLength: 200
        website:
          type: string
          maxLength: 200
          description: >-
            Free text, deliberately not validated as a URL — people type
            "legesenteret.no" and saving matters more than being right
            about URL shape.
        notes:
          type: string
          maxLength: 2000
        babyIds:
          type: array
          maxItems: 10
          default: []
          items:
            type: string
    UpdateContact:
      type: object
      description: >-
        Every field is optional; an empty object is a no-op.
        `role`/`icon`/`phone`/`email`/`website`/`notes` may also be sent as
        `null` to CLEAR that column; `name` is not nullable — only settable
        or omitted. `babyIds`, when present, REPLACES the link set; omitted
        leaves it untouched.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        role:
          type: string
          maxLength: 60
          nullable: true
        icon:
          type: string
          enum:
            [
              user,
              doctor,
              nurse,
              hospital,
              dental,
              family,
              grandparent,
              daycare,
              friend,
              phone,
            ]
          nullable: true
        phone:
          type: string
          maxLength: 40
          nullable: true
        email:
          type: string
          format: email
          maxLength: 200
          nullable: true
        website:
          type: string
          maxLength: 200
          nullable: true
        notes:
          type: string
          maxLength: 2000
          nullable: true
        babyIds:
          type: array
          maxItems: 10
          items:
            type: string
    PushConfig:
      type: object
      required: [publicKey]
      properties:
        publicKey:
          type: string
    Subscribe:
      type: object
      required: [endpoint, p256dh, auth]
      properties:
        endpoint:
          type: string
          format: uri
          maxLength: 1000
        p256dh:
          type: string
          minLength: 1
          maxLength: 300
        auth:
          type: string
          minLength: 1
          maxLength: 100
    Unsubscribe:
      type: object
      required: [endpoint]
      properties:
        endpoint:
          type: string
          maxLength: 1000
    PushPrefs:
      type: object
      description: >-
        feedReminderHours is off (0) or a lead time in hours before a
        reminder fires; the enum matches the frontend's fixed picker
        (off/3/4/6).
      required: [feedReminderHours]
      properties:
        feedReminderHours:
          type: integer
          enum: [0, 3, 4, 6]
          default: 0
    PushTestResult:
      type: object
      required: [sent]
      properties:
        sent:
          type: integer
    ApiKey:
      type: object
      description: >-
        One bearer API key, key material never included (see ApiKeyCreated
        for the one response that carries it).
      required:
        - id
        - name
        - prefix
        - createdAt
        - lastUsedAt
        - revokedAt
        - expiresAt
        - readOnly
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
          description: The displayable head of the full key (`pjk_` + 8 more chars).
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        readOnly:
          type: boolean
    CreateApiKey:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        expiresInDays:
          type: integer
          format: int32
          minimum: 1
          maximum: 3650
          description: Omitted means the key never expires.
        readOnly:
          type: boolean
          default: false
    ApiKeyCreated:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: >-
                The full bearer token (`pjk_…`). Shown exactly once — this
                response is the only place it ever appears.
    Invite:
      type: object
      required:
        - code
        - familyId
        - role
        - expiresAt
        - maxUses
        - usedCount
        - revokedAt
        - url
      properties:
        code:
          type: string
        familyId:
          type: string
        role:
          type: string
          enum: [admin, member]
        expiresAt:
          type: string
          format: date-time
        maxUses:
          type: integer
        usedCount:
          type: integer
        revokedAt:
          type: string
          format: date-time
          nullable: true
        url:
          type: string
          description: "`{AppURL}/join/{code}`, ready to render as a QR code."
    CreateInvite:
      type: object
      description: Every field is optional; an empty (or absent) body uses every default.
      properties:
        role:
          type: string
          enum: [admin, member]
          default: member
        expiresInHours:
          type: integer
          minimum: 1
          maximum: 720
          default: 72
        maxUses:
          type: integer
          minimum: 1
          maximum: 50
          default: 5
    InviteInfo:
      type: object
      required: [valid, familyName, role, reason]
      properties:
        valid:
          type: boolean
        familyName:
          type: string
          nullable: true
        role:
          type: string
          enum: [admin, member]
          nullable: true
        reason:
          type: string
          enum: [revoked, expired, exhausted, not_found]
          nullable: true
    Redeem:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
    RedeemResult:
      type: object
      required: [familyId, familyName, role, alreadyMember]
      properties:
        familyId:
          type: string
        familyName:
          type: string
        role:
          type: string
          enum: [admin, member]
        alreadyMember:
          type: boolean

    # --- System-admin console (Task 21) ---------------------------------
    AdminStats:
      type: object
      description: >-
        Platform totals. Every count is a plain integer — the underlying
        COUNT(*) is bigint and must be cast (`::int`) in SQL, or the driver
        hands it back as a string (CLAUDE.md's Postgres notes).
      required:
        [families, users, babies, coreLogs, pushSubscriptions, usersLast7d]
      properties:
        families:
          type: integer
        users:
          type: integer
          description: >-
            Every row in `users`, the "Deleted user" tombstone included —
            the TypeScript predecessor counted it the same way once it had
            been created.
        babies:
          type: integer
        coreLogs:
          type: integer
          description: Feeds + diapers + sleeps.
        pushSubscriptions:
          type: integer
        usersLast7d:
          type: integer
    AdminFamily:
      type: object
      required:
        [id, name, slug, plan, createdAt, members, babies, lastFeedAt]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        plan:
          type: string
        createdAt:
          type: string
          format: date-time
        members:
          type: integer
        babies:
          type: integer
        lastFeedAt:
          type: string
          format: date-time
          nullable: true
    AdminUser:
      type: object
      required: [id, name, email, role, banned, banReason, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          nullable: true
          description: Ours, system-admin role. "admin" or null.
        banned:
          type: boolean
        banReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    BanUser:
      type: object
      description: Every field is optional; an absent body bans with no stated reason.
      properties:
        reason:
          type: string
          maxLength: 500
    SetUserPassword:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 8
          maxLength: 128
    AuditEntry:
      type: object
      required: [id, adminId, adminName, action, target, detail, createdAt]
      properties:
        id:
          type: string
        adminId:
          type: string
        adminName:
          type: string
        action:
          type: string
        target:
          type: string
        detail:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    AuditNote:
      type: object
      required: [action, target]
      properties:
        action:
          type: string
          minLength: 1
          maxLength: 60
        target:
          type: string
          minLength: 1
          maxLength: 200
        detail:
          type: string
          maxLength: 500
    Error:
      type: object
      description: >-
        The error envelope used by every non-2xx JSON response in the API
        (CLAUDE.md: "{error: string, code: string}" everywhere).
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
        issues:
          type: array
          description: >-
            Optional per-field validation issues. The frontend only reads
            error/code today; issues exist for future, more specific UI.
          items:
            type: object
            required: [path, message]
            properties:
              path:
                type: string
              message:
                type: string
