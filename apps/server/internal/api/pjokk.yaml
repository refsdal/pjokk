        typed, everything else additionalProperties) rather than a oneOf
        discriminated union: oapi-codegen has no clean Go representation for
        eleven structurally different variants sharing one JSON shape.
      required: [kind, id, babyId, caretakerId, caretakerName, notes]
      properties:
        kind:
          type: string
          enum:
            - feed
            - diaper
            - sleep
            - medicine
            - bath
            - note
            - milestone
            - measurement
            - pump
            - play
            - vaccine
        id:
          type: string
        babyId:
          type: string
        caretakerId:
          type: string
        caretakerName:
          type: string
        notes:
          type: string
          nullable: true
      additionalProperties: true
