          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEvent"
        "400":
          description: Unknown baby or family member reference.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No event with this id in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteCalendarEvent
      summary: Delete an event; its link rows cascade.
      tags: [calendar]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "404":
          description: No event with this id in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

