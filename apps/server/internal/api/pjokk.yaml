          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: >-
            Exclusive range end. Must be after `from`, and the span must not
            exceed 366 days.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Events in [from, to), ascending by startTime.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarEvent"
        "400":
          description: to <= from, or the span exceeds 366 days.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createCalendarEvent
      summary: >-
        Create a family-wide (or baby-specific) event. babyIds/
        assigneeUserIds must belong to the caller's family — see
        internal/api/calendar.go's refsValid. Duplicate ids are deduped
        before insert.
      tags: [calendar]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCalendarEvent"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEvent"
        "400":
          description: Unknown baby or family member reference.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/calendar/events/{id}:
    patch:
      operationId: updateCalendarEvent
      summary: >-
        Partial update. `description`/`location`/`durationMin`/
        `remindMinutesBefore` may be sent as `null` to CLEAR that column;
        `title`/`category`/`startTime`/`allDay` are not nullable — only
        settable or omitted. An event that IS (or becomes, via this same
        PATCH) all-day always has durationMin cleared. Changing `startTime`
        or `remindMinutesBefore` re-arms the reminder sweep (clears
        remindedAt). `babyIds`/`assigneeUserIds`, when present, REPLACE the
        link set; omitted leaves it untouched.
      tags: [calendar]
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCalendarEvent"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEvent"
        "400":
          description: Unknown baby or family member reference.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No event with this id in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteCalendarEvent
      summary: Delete an event; its link rows cascade.
      tags: [calendar]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "404":
          description: No event with this id in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/contacts:
    get:
      operationId: listContacts
      summary: >-
        The family's address book, by name. Zero linked babies means a
        contact the whole family shares. Free (no plan gate — see
        internal/api/contacts.go).
      tags: [contacts]
      responses:
        "200":
          description: Contacts, by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contact"
    post:
      operationId: createContact
      summary: >-
        Create a contact. babyIds must belong to the caller's family — see
        internal/api/contacts.go's refsValid. Duplicate ids are deduped
        before insert.
      tags: [contacts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContact"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "400":
          description: Unknown baby reference.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/contacts/{id}:
    patch:
      operationId: updateContact
      summary: >-
        Partial update. `role`/`icon`/`phone`/`email`/`website`/`notes` may
        be sent as `null` to CLEAR that column; `name` is not nullable —
        only settable or omitted. `babyIds`, when present, REPLACES the
        link set; omitted leaves it untouched.
      tags: [contacts]
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContact"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "400":
          description: Unknown baby reference.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No contact with this id in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteContact
      summary: Delete a contact; its link rows cascade.
      tags: [contacts]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "404":
          description: No contact with this id in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/timeline:
    get:
      operationId: listTimeline
      summary: >-
        The merged feed of everything, newest first. Sleep and play entries
        sort by their startTime (active sessions have endTime null); every
        other kind sorts by time. filter=other selects the eight non-core
        kinds (medicine, bath, note, milestone, measurement, pump, play,
        vaccine) together; omitting filter returns all eleven.
      tags: [timeline]
      parameters:
        - name: babyId
          in: query
          required: true
          schema:
            type: string
        - name: before
          in: query
          required: false
          description: >-
            Opaque keyset cursor from a previous page's nextCursor
            ("<epochMs>|<id>"). The id tiebreak keeps pagination lossless
            across equal timestamps.
          schema:
            type: string
            pattern: ^\d{1,15}\|.{1,64}$
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: filter
          in: query
          required: false
          schema:
            type: string
            enum: [feeds, diapers, sleep, other]
        - name: q
          in: query
          required: false
          description: >-
            Case-insensitive substring search (issue #52) over each kind's
            free text — notes everywhere, plus medicine and vaccine names,
            milestone titles, note bodies, solids food and sleep location.
            Combines with `filter`.
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        "200":
          description: Timeline page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timeline"
        "404":
          description: Unknown baby.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/stats:
    get:
      operationId: getStats
      summary: >-
        Per-day sleep/intake/counts plus averages for the window, and the
        latest weight with its predecessor. Sleep sessions are split across
        local midnights. Free for any window up to 90 days — the TS
        predecessor's statsMonth premium gate on days>7 is removed.
      tags: [stats]
      parameters:
        - name: babyId
          in: query
          required: true
          schema:
            type: string
        - name: days
          in: query
          required: false
          description: Window length in local days, today included.
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 7
        - name: tz
          in: query
          required: false
          description: >-
            The requester's Date.getTimezoneOffset() (minutes,
            UTC-minus-local). Day buckets follow the caretaker's clock, not
            the server's. Defaults to 0 (UTC) when omitted.
          schema:
            type: integer
            minimum: -840
            maximum: 840
            default: 0
      responses:
        "200":
          description: Stats for the window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"
        "404":
          description: Unknown baby.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/me:
    get:
      operationId: getMe
      summary: >-
        Session info for the SPA shell. Requires a session but NOT an
        active family — the family/member/plan fields are null when the
        caller has none.
      tags: [me]
      responses:
        "200":
          description: The caller's session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
    patch:
      operationId: updateMe
      summary: >-
        Edit the caller's own profile. Global across families, so a session
        but NOT an active family is required. `null` clears nickname or
        phone; an absent field is left alone. Name is trimmed and must not
        be blank; phone may hold digits, spaces, +, -, ( and ).
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMe"
      responses:
        "200":
          description: The updated profile, same shape as GET.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          description: Blank name, or a phone with characters outside the allowed set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/push/config:
    get:
      operationId: getPushConfig
      summary: >-
        The VAPID public key the frontend needs to create a browser push
        subscription. Never available to API keys (device/session-bound —
        see internal/api/middleware's RejectAPIKey).
      tags: [push]
      responses:
        "200":
          description: VAPID public key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushConfig"

  /api/push/subscribe:
    post:
      operationId: subscribePush
      summary: >-
        Register this browser's push subscription for the signed-in
        caretaker. Upserts by endpoint: re-subscribing the SAME endpoint
        rebinds it to the calling user/family and refreshes its keys rather
        than failing a uniqueness check. Rejects an endpoint whose host
        isn't one of the recognized push services, or that isn't https — see
        internal/api/push.go's isAllowedPushEndpoint (SSRF guard: the
        scheduler later POSTs to stored endpoints unattended).
      tags: [push]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Subscribe"
      responses:
        "200":
          description: Stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          description: Not a recognized push service endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/push/unsubscribe:
    post:
      operationId: unsubscribePush
      summary: >-
        Remove a subscription. Scoped to the caller's OWN rows — deleting by
        endpoint alone would let one caretaker remove another's
        subscription just by knowing the endpoint URL. Removing an endpoint
        that isn't the caller's (or doesn't exist) is still a 200: this is a
        set-membership operation, not a lookup.
      tags: [push]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Unsubscribe"
      responses:
        "200":
          description: Removed (if it was the caller's).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"

  /api/reminders:
    get:
      operationId: listReminders
      summary: >-
        The caller's own reminders in the active family (issue #45). A
        reminder is a personal nag, not family state: another member never
        sees it, and an API key (no person behind it) cannot reach these
        endpoints at all.
      tags: [push]
      responses:
        "200":
          description: Reminders, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reminder"
    post:
      operationId: createReminder
      summary: >-
        Add a reminder. `since_last` fires once the newest log of `kind` is
        older than `intervalMin` (once per gap; a newer log resets it);
        `at_time` fires once per day in `days` at `atMinute` of local time
        in `tz`. A `custom` reminder is always `at_time` and needs a
        `label`; a `medicine` reminder's `label` is the medicine name it
        keys on (omit for any dose). Quiet hours hold a due reminder
        without latching it. Delivery rides the */15 cron, so it can lag
        the moment by up to 15 minutes.
      tags: [push]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReminder"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
        "400":
          description: >-
            The mode's field is missing, a custom reminder is not at_time or
            has no label, the timezone is unknown, or quiet hours are
            half-set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown baby.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/reminders/{id}:
    delete:
      operationId: deleteReminder
      summary: Remove one of the caller's reminders.
      tags: [push]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "404":
          description: No such reminder of the caller's.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/push/test:
    post:
      operationId: testPush
      summary: >-
        Send a test notification to every device the caller has subscribed,
        via Deps.Push.ToUser. Returns how many deliveries succeeded.
      tags: [push]
      responses:
        "200":
          description: Delivery count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushTestResult"

  /api/help:
    post:
      operationId: createHelpRequest
      summary: >-
        Ask another member of the active family for a hand. The target gets
        a push notification naming the caller; the request itself is family
        state (Summary.openHelp) until acknowledged, dismissed, or two hours
        old. Session-only: the notification is attributed to a person and a
        pjk_ key has none. Rate-limited per CALLER (5 per 5 minutes) inside
        the handler — the IP-keyed middleware limiter would throttle a whole
        household together. A push failure does not fail the request; read
        `delivered`.
      tags: [help]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHelpRequest"
      responses:
        "201":
          description: Created. `delivered` counts the devices the push reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpRequest"
        "400":
          description: The target is the caller (SELF_HELP).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such member in the caller's family (MEMBER_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: More than 5 requests in 5 minutes from this caller (RATE_LIMITED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/help/{id}/acknowledge:
    post:
      operationId: acknowledgeHelpRequest
      summary: >-
        "On my way". ANY family member may acknowledge, not only the target
        — whoever is closer answers. Idempotent: a second acknowledge
        returns the row unchanged and sends nothing. The first one pushes
        "<name> is on the way" to the sender, unless the sender is
        acknowledging their own request.
      tags: [help]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: The request, acknowledged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpRequest"
        "404":
          description: No such request in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/help/{id}:
    delete:
      operationId: deleteHelpRequest
      summary: >-
        Dismiss a request ("Never mind" while open, "Done" once answered).
        Sender or family admin only.
      tags: [help]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: Dismissed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "403":
          description: Neither the sender nor an admin (NOT_SENDER).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such request in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/keys:
    get:
      operationId: listApiKeys
      summary: >-
        Bearer API keys for the family, newest first. The full key is never
        included — only createApiKey's response ever carries it. Family
        admin only; refused for API-key callers (Task 19).
      tags: [api-keys]
      responses:
        "200":
          description: Keys for the family, key material omitted.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKey"
    post:
      operationId: createApiKey
      summary: >-
        Create a bearer API key for integrations (Home Assistant, Grafana).
        The full key is returned ONCE and never again — use it as
        `Authorization: Bearer pjk_…`. Free (no plan gate — the TypeScript
        predecessor's apiKeys 402 is removed). Family admin only; refused
        for API-key callers.
      tags: [api-keys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKey"
      responses:
        "201":
          description: Created — copy the key now, it is never shown again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreated"
  /api/keys/{id}:
    delete:
      operationId: revokeApiKey
      summary: >-
        Revoke a key: sets revoked_at rather than deleting the row, so a
        revoked key becomes indistinguishable from one that never existed to
        APIKeyAuth (which filters on revoked_at IS NULL) while its audit
        trail (name, createdBy, createdAt) survives. Family admin only;
        refused for API-key callers.
      tags: [api-keys]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "404":
          description: No key with this id in the caller's family, or already revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/devices:
    get:
      operationId: listDevices
      summary: >-
        The family's kiosk devices that are waiting to be set up or active,
        newest first; revoked devices are not listed. Family admin only;
        refused for API keys and devices.
      tags: [devices]
      responses:
        "200":
          description: Pending and active devices, key material omitted.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"
    post:
      operationId: createDevice
      summary: >-
        Add a kiosk device (docs/superpowers/specs/2026-09-10-kiosk-devices-
        design.md). Returns a one-time code — 8 characters, valid 15
        minutes, shown once and stored only as a hash — that a tablet enters
        on /kiosk/setup. At most 10 devices per family that are not revoked.
        Family admin only; refused for API keys and devices.
      tags: [devices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDevice"
      responses:
        "201":
          description: Created, waiting for set-up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceCode"
        "400":
          description: A name that is blank once trimmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The family already has 10 devices (DEVICE_LIMIT).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/devices/{id}:
    delete:
      operationId: revokeDevice
      summary: >-
        Revoke a device, pending or active. Its cookie stops working on the
        tablet's next request. Family admin only; refused for API keys and
        devices.
      tags: [devices]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "204":
          description: Revoked.
        "404":
          description: No such device in the caller's family, or already revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/devices/{id}/code:
    post:
      operationId: renewDeviceCode
      summary: >-
        A new one-time code for a device that has not been set up yet; the
        previous code stops working. Family admin only; refused for API keys
        and devices.
      tags: [devices]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: A new code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceCode"
        "404":
          description: No such device in the caller's family, or revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The device is already set up (ALREADY_ENROLLED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/device/enrol:
    post:
      operationId: enrolDevice
      summary: >-
        Turn this browser into the kiosk device a family admin added: redeem
        its one-time code and choose the PIN that later un-enrols it. No
        sign-in — the code is the credential. Sets the httpOnly pjokk_device
        cookie. Unknown, expired and already-used codes are one answer.
        Rate-limited: 10/10min per client plus a 200/10min global backstop.
      tags: [devices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrolDevice"
      responses:
        "200":
          description: Enrolled; the device cookie is set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceSelf"
        "400":
          description: Unknown, expired or already-used code (INVALID_CODE).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many attempts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/device:
    get:
      operationId: getDevice
      summary: >-
        The kiosk device behind this request's pjokk_device cookie. Anyone
        who is not an enrolled device gets 401 NOT_A_DEVICE.
      tags: [devices]
      responses:
        "200":
          description: This device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceSelf"
        "401":
          description: Not a kiosk device (NOT_A_DEVICE), or revoked (DEVICE_REVOKED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/device/unenrol:
    post:
      operationId: unenrolDevice
      summary: >-
        Leave kiosk mode on this tablet: with the device PIN, revoke the
        device and clear its cookie. Five attempts per device per ten
        minutes, whichever client sends them.
      tags: [devices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Unenrol"
      responses:
        "204":
          description: Un-enrolled; the cookie is cleared.
        "401":
          description: Not a kiosk device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Wrong PIN (WRONG_PIN).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many attempts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/device/thresholds:
    get:
      operationId: listDeviceThresholds
      summary: >-
        The kiosk's amber card: every caretaker's since-last feed and diaper
        reminder interval in the device's family. The intervals only — no
        labels, schedules or quiet hours leave the server.
      tags: [devices]
      responses:
        "200":
          description: Intervals, by kind then length.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceThreshold"
        "401":
          description: Not a kiosk device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/invites:
    get:
      operationId: listInvites
      summary: >-
        Invite codes ever issued for the family, newest first — used and
        revoked ones included. Family admin only.
      tags: [invites]
      responses:
        "200":
          description: Invites for the family.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invite"
    post:
      operationId: createInvite
      summary: >-
        Mint an invite code (QR-at-Sunday-dinner grain: codes are shared
        aloud or by QR, not email-addressed like Limen's own organization
        invitations). Family admin only.
      tags: [invites]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvite"
      responses:
        "201":
          description: Created invite code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
  /api/invites/{code}:
    delete:
      operationId: revokeInvite
      summary: >-
        Revoke a code (sets revokedAt) so it can no longer be redeemed.
        Family admin only.
      tags: [invites]
      parameters:
        - $ref: "#/components/parameters/codePath"
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "404":
          description: No such code in the caller's family, or already revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/invites/info/{code}:
    get:
      operationId: getInviteInfo
      summary: >-
        What the /join page shows before sign-in: which family, which
        role, still valid? No session required. Codes are credentials, so
        this is rate-limited: 30/10min per client plus a 500/10min global
        backstop against distributed guessing.
      tags: [invites]
      parameters:
        - $ref: "#/components/parameters/codePath"
      responses:
        "200":
          description: Invite status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteInfo"
  /api/invites/redeem:
    post:
      operationId: redeemInvite
      summary: >-
        Join a family with an invite code. Requires a signed-in session —
        no active family required, since this IS how one is acquired.
        Membership and the code's use-count are written atomically in one
        transaction. Rate-limited: 10/10min per client plus a 200/10min
        global backstop.
      tags: [invites]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Redeem"
      responses:
        "200":
          description: Joined (or already a member).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedeemResult"
        "400":
          description: Invalid, expired, exhausted, or revoked code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # --- System-admin console (Task 21; REF §A1 admin.ts) -------------------
  # Every operation below runs behind RequireSysadmin (users.role ==
  # "admin", a column of ours unrelated to the per-family admin role) and
  # is refused outright for API-key callers — EXCEPT
  # /api/admin/stop-impersonating, which is deliberately session-level;
  # see its own summary.
  /api/admin/stats:
    get:
      operationId: getAdminStats
      summary: >-
        Platform totals for the /admin dashboard. coreLogs is feeds +
        diapers + sleeps; usersLast7d counts accounts created in the last
        seven days. System admin only.
      tags: [admin]
      responses:
        "200":
          description: Platform totals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
  /api/admin/families:
    get:
      operationId: listAdminFamilies
      summary: >-
        Families on the platform with member and baby counts, whether each
        still has an admin, and the timestamp of its most recent feed (null
        when it has never logged one). `query` filters on name or slug
        (case-insensitive substring). One page at a time, newest first: pass the previous page's `nextCursor` as `cursor` (`limit` 50 by default, 200 at most); a malformed cursor is a 400. System admin
        only.
      tags: [admin]
      parameters:
        - name: query
          in: query
          description: Case-insensitive substring match on name or slug.
          required: false
          schema:
            type: string
            maxLength: 200
        - $ref: "#/components/parameters/cursorQuery"
        - $ref: "#/components/parameters/limitQuery"
      responses:
        "200":
          description: One page of families.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFamilyPage"
        "400":
          description: A malformed cursor (VALIDATION).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createAdminFamily
      summary: >-
        Create a family on someone's behalf. Three behaviours, chosen by the
        body: `adminEmail` naming an existing account makes it the family
        admin; `adminEmail` with no account is refused with 404 UNLESS
        `createAccount` is true, which provisions a passwordless account
        (`adminName` required) that the person later claims by signing in
        with Google on the same address; no `adminEmail` at all creates an
        empty family plus an admin-role invite, returned as a join URL.

        Not one transaction — account creation and family creation each go
        through the auth library, which opens its own. The steps are ordered
        so a partial failure leaves only a memberless account, which is
        inert and swept by the orphan purge after seven days. Audited as
        `user.create` (when one is provisioned) and `family.create`. System
        admin only.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminFamily"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFamilyCreated"
        "400":
          description: >-
            `createAccount` without `adminName`, or an account already
            exists for that address in a way that cannot be used.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No account for `adminEmail` and `createAccount` was not set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/families/{id}:
    get:
      operationId: getAdminFamily
      summary: >-
        One family in full: metadata, members with roles, babies, live
        invites and API keys. Deliberately carries NO log content and no
        per-type counts — the operator console stays metadata-only, so
        nothing derived from a child's health record enters it.
        Impersonation remains the only route to a family's entries. System
        admin only.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: The family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFamilyDetail"
        "404":
          description: No family with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateAdminFamily
      summary: >-
        Rename a family. The slug is deliberately left alone: it is derived
        at creation time and regenerating it would change an identifier
        under whatever already holds it. Audited as `family.rename`. System
        admin only.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminFamily"
      responses:
        "200":
          description: Renamed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "404":
          description: No family with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteAdminFamily
      summary: >-
        Delete a family and ALL its data — members, babies, invites, keys
        and every log cascade with the organization row. Audited as
        `family.delete` before the delete runs. System admin only.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "404":
          description: No family with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/families/{id}/members:
    post:
      operationId: addAdminFamilyMember
      summary: >-
        Add an existing account to a family by email address. The account
        must already exist — this route never creates one, so a mistyped
        address is a 404 rather than a stray user. Audited as
        `family.member.add`. System admin only.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddAdminFamilyMember"
      responses:
        "200":
          description: Added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          description: The account is already a member of this family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No family with this id, or no account for that email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/families/{id}/members/{memberId}:
    delete:
      operationId: removeAdminFamilyMember
      summary: >-
        Remove a member from a family. The last-admin guard applies to
        system admins too: a family must never be left with a role nobody
        holds, and promoting someone else first is always available.
        Audited as `family.member.remove`. System admin only.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/idPath"
        - $ref: "#/components/parameters/memberIdPath"
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          description: Cannot remove the family's last admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No family with this id, or no such member in it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/families/{id}/members/{memberId}/role:
    post:
      operationId: setAdminFamilyMemberRole
      summary: >-
        Change a member's role within a family. Demoting the last admin is
        refused for the same reason removing them is. Audited as
        `family.member.role`. System admin only.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/idPath"
        - $ref: "#/components/parameters/memberIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMemberRole"
      responses:
        "200":
          description: Role changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          description: Cannot demote the family's last admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No family with this id, or no such member in it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/families/{id}/invites:
    post:
      operationId: createAdminFamilyInvite
      summary: >-
        Mint an invite for a family the operator is not a member of. Same
        code generation, defaults and response shape as the family-admin
        route — both call one shared core, so the two can never grow
        different alphabets or expiry rules. Audited as
        `family.invite.create`. System admin only.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvite"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "404":
          description: No family with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/families/{id}/invites/{code}:
    delete:
      operationId: revokeAdminFamilyInvite
      summary: >-
        Revoke one of a family's invite codes. Scoped by family id as well
        as code, so an operator cannot revoke another family's invite by
        guessing its code. Audited as `family.invite.revoke`. System admin
        only.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/idPath"
        - $ref: "#/components/parameters/codePath"
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "404":
          description: No such live invite in this family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/families/{id}/keys/{keyId}:
    delete:
      operationId: revokeAdminFamilyKey
      summary: >-
        Revoke one of a family's API keys — the way to kill a leaked
        integration token without impersonating anyone. Sets revoked_at
        rather than deleting the row, exactly as the family-admin route
        does. Audited as `family.key.revoke`. System admin only.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/idPath"
        - $ref: "#/components/parameters/keyIdPath"
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "404":
          description: No such live key in this family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/users:
    get:
      operationId: listAdminUsers
      summary: >-
        Accounts on the platform (never the tombstone that deleted accounts'
        records point at). `query` filters on name or email
        (case-insensitive substring). One page at a time, newest first: pass the previous page's `nextCursor` as `cursor` (`limit` 50 by default, 200 at most); a malformed cursor is a 400. NEW in Go —
        replaces the better-auth admin plugin's client-side listUsers call.
        System admin only.
      tags: [admin]
      parameters:
        - name: query
          in: query
          description: Case-insensitive substring match on name or email.
          required: false
          schema:
            type: string
            maxLength: 200
        - $ref: "#/components/parameters/cursorQuery"
        - $ref: "#/components/parameters/limitQuery"
      responses:
        "200":
          description: One page of matching accounts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserPage"
        "400":
          description: A malformed cursor (VALIDATION).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/users/{id}:
    get:
      operationId: getAdminUserDetail
      summary: >-
        One person, for the operator console's user page: their families and
        their role in each, how they sign in, and their live sessions
        (browser and device, when each started and was last active, which
        family it is in, and whether an operator is driving it). Never a
        token or an address. 404 for an unknown id or the tombstone. System
        admin only.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: The person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"
        "404":
          description: No such person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/users/{id}/email:
    post:
      operationId: changeAdminUserEmail
      summary: >-
        Change a person's login address. Their sessions and a linked Google
        account stay (Google sign-in follows the Google account's id, not the
        address); password sign-in uses the new address from then on. Audited
        old → new. 409 EMAIL_TAKEN when another account holds it, 400
        UNCHANGED when it is already theirs. System admin only.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminEmailChange"
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          description: Not an address (VALIDATION), or already theirs (UNCHANGED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Another account has this address (EMAIL_TAKEN).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/users/{id}/role:
    delete:
      operationId: revokeAdminUserRole
      summary: >-
        Take the system-admin role away. Never your own (400 REFUSED), never
        the last active admin's (409 LAST_ADMIN — two operators revoking each
        other at once cannot leave nobody), and it ends any session they are
        driving through impersonation. Effective on their next request.
        There is deliberately no route that GRANTS the role. System admin
        only.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "204":
          description: Revoked.
        "400":
          description: Your own role (REFUSED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such person, or not a system admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The last active system admin (LAST_ADMIN).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/users/{id}/sessions/{sessionId}:
    delete:
      operationId: revokeAdminUserSession
      summary: >-
        Sign out one of a person's sessions ("I left it signed in on my
        sister's phone"). Audited with the session's user agent. 404 when
        the session is not theirs. System admin only.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/idPath"
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Signed out.
        "404":
          description: No such person, or not their session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/users/{id}/delete:
    post:
      operationId: deleteAdminUser
      summary: >-
        Delete an account safely. Every non-cascading reference to the user
        (log attribution on all eleven log kinds, vaccine documents and
        dismissals, invites, API keys, calendar events and audit rows) is
        reassigned to the tombstone "Deleted user" in ONE transaction,
        calendar assignments are dropped, the user's API keys are revoked,
        and only then is the account removed
        (sessions, memberships and push subscriptions cascade). POST rather
        than DELETE, matching the TypeScript predecessor's route. Audited
        as `user.delete`. System admin only.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          description: Refused — the caller's own account, or the tombstone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No user with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/users/{id}/ban:
    post:
      operationId: banAdminUser
      summary: >-
        Ban an account: sets banned + ban_reason AND revokes every session
        the user holds, so the ban is enforced by absence rather than by
        every reader remembering to check a flag. Their API keys stop
        authenticating too (GetAPIKeyByHash joins on a non-banned creator).
        Audited as `user.ban`. System admin only.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BanUser"
      responses:
        "200":
          description: Banned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          description: Refused — an admin may not ban their own account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No user with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/users/{id}/unban:
    post:
      operationId: unbanAdminUser
      summary: >-
        Lift a ban: clears banned + ban_reason. Sessions revoked by the ban
        stay revoked — the user signs in again. Audited as `user.unban`.
        System admin only.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: Unbanned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "404":
          description: No user with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/users/{id}/password:
    post:
      operationId: setAdminUserPassword
      summary: >-
        Set a user's password (support flow — also establishes a first
        password for an account created through the invite flow with no
        credential). The password itself is NEVER written to the audit
        trail; the row records only the user id. Audited as
        `user.password.set`. System admin only.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetUserPassword"
      responses:
        "200":
          description: Password set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          description: >-
            The password does not meet the credential policy. `minLength`
            below is checked before the handler runs; the rest of the
            policy (an uppercase letter and a number, per Limen's
            configured defaults) cannot be expressed as a JSON-Schema
            constraint and is reported here, with the same VALIDATION code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No user with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/users/{id}/sessions/revoke:
    post:
      operationId: revokeAdminUserSessions
      summary: >-
        Sign a user out everywhere. Audited as `user.sessions.revoke`.
        System admin only.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: Sessions revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "404":
          description: No user with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/users/{id}/impersonate:
    post:
      operationId: impersonateAdminUser
      summary: >-
        Sign in as another user for support. Mints a session for the target
        carrying the admin's id in its metadata (the in-app banner reads
        it) and swaps the session cookie over; the admin's own session is
        kept, and POST /api/admin/stop-impersonating restores it. Refused
        for the caller's own account and for banned targets. Audited as
        `user.impersonate` against the REAL admin. System admin only.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: Impersonating — the response carries the target's session cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          description: >-
            Refused — the caller's own account, a banned target, or a
            caller who is themselves being impersonated (impersonation
            cannot be chained).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No user with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/stop-impersonating:
    post:
      operationId: stopImpersonating
      summary: >-
        End an impersonation and restore the admin's own session cookie.
        Deliberately session-level, NOT system-admin-gated: while
        impersonating an ordinary user the current session IS that user's,
        so a sysadmin gate would trap the operator inside the impersonated
        session. A caller who is not impersonating gets 400
        NOT_IMPERSONATING — which is all an ordinary user can ever reach
        here. Audited as `impersonation.stop` against the real admin.
      tags: [admin]
      responses:
        "200":
          description: Impersonation ended — the response restores the admin's cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          description: This session is not impersonating anyone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/audit:
    get:
      operationId: listAdminAudit
      summary: >-
        The append-only system-admin trail. `target` narrows it to the
        entries about one thing (the user page's history passes a user id).
        One page at a time, newest first: pass the previous page's `nextCursor` as `cursor` (`limit` 50 by default, 200 at most); a malformed cursor is a 400. System admin only.
      tags: [admin]
      parameters:
        - name: target
          in: query
          description: Only entries whose target is exactly this.
          required: false
          schema:
            type: string
            maxLength: 200
        - $ref: "#/components/parameters/cursorQuery"
        - $ref: "#/components/parameters/limitQuery"
      responses:
        "200":
          description: One page of admin actions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        "400":
          description: A malformed cursor (VALIDATION).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createAdminAuditNote
      summary: >-
        Append an entry to the trail by hand, for an admin action performed
        outside these routes. System admin only.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditNote"
      responses:
        "200":
          description: Recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"

components:
  parameters:
    babyIdQuery:
      name: babyId
      in: query
      description: Restrict the result to one baby in the caller's family.
      required: false
      schema:
        type: string
    limitQuery:
      name: limit
      in: query
      description: Maximum number of rows to return.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
    cursorQuery:
      name: cursor
      in: query
      description: The previous page's nextCursor; omit for the first page.
      required: false
      schema:
        type: string
        maxLength: 200
    idPath:
      name: id
      in: path
      description: Resource id.
      required: true
      schema:
        type: string
    memberIdPath:
      name: memberId
      in: path
      description: The family-membership row id (NOT the user id).
      required: true
      schema:
        type: string
    codePath:
      name: code
      in: path
      description: An invite code.
      required: true
      schema:
        type: string
    keyIdPath:
      name: keyId
      in: path
      description: >-
        An API key's id. Named separately from idPath because the admin
        route that uses it already spends `id` on the family.
      required: true
      schema:
        type: string
  schemas:
    Ok:
      type: object
      description: The standard `{ok:true}` success body for actions with no other payload.
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]
    Baby:
      type: object
      required: [id, name, birthDate, sex]
      properties:
        id:
          type: string
        name:
          type: string
        birthDate:
          type: string
          format: date-time
        sex:
          type: string
          enum: [girl, boy]
          nullable: true
      x-go-name: Baby
    CreateBaby:
      type: object
      required: [name, birthDate]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        birthDate:
          type: string
          format: date-time
        sex:
          type: string
          enum: [girl, boy]
    UpdateBaby:
      type: object
      description: >-
        Every field is optional; an empty object is a no-op. `sex` may also
        be sent as `null`, which — like omitting it — leaves the baby's sex
        unchanged (Go's JSON decoding cannot tell "absent" from "null" for a
        nullable-optional field without a bespoke wrapper type, and no
        caller needs to clear sex back to unknown today; see
        internal/api/babies.go).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        birthDate:
          type: string
          format: date-time
        sex:
          type: string
          enum: [girl, boy]
          nullable: true
    UpdateMe:
      type: object
      description: >-
        Every field optional. `nickname` and `phone` accept `null` to
        clear; the handler reads the raw body (internal/api/patch.go) to
        tell null from absent.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        nickname:
          type: string
          maxLength: 40
          nullable: true
        phone:
          type: string
          maxLength: 32
          nullable: true
        units:
          type: string
          enum: [metric, imperial]
    Member:
      type: object
      required: [memberId, userId, name, email, role, avatarUrl, hasPush]
      properties:
        memberId:
          type: string
          description: The family-membership row id (NOT the user id).
        userId:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
        avatarUrl:
          type: string
          nullable: true
          description: Same shape as Me.avatarUrl; null without a photo.
        hasPush:
          type: boolean
          description: >-
            Whether this member has at least one device subscribed to push.
            The help picker dims members a ping cannot reach.
    Family:
      type: object
      required: [id, name, slug, plan]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        plan:
          type: string
    SetMemberRole:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, member]
    Me:
      type: object
      description: >-
        familyId/memberRole/plan/impersonatedBy are null when the caller has
        no active family (or, for impersonatedBy, is not impersonated).
      required:
        [
          userId,
          name,
          displayName,
          nickname,
          phone,
          avatarUrl,
          email,
          role,
          familyId,
          memberRole,
          plan,
          impersonatedBy,
          version,
          units,
        ]
      properties:
        userId:
          type: string
        name:
          type: string
        units:
          type: string
          enum: [metric, imperial]
          description: >-
            Display units (issue #53). Stored values are always metric;
            the SPA converts at the edge. Follows the person across
            families and devices.
        displayName:
          type: string
          description: >-
            Nickname when set, else name — what every other member sees
            (users.display_name, a generated column).
        nickname:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
          description: Private to the user; never on Member.
        avatarUrl:
          type: string
          nullable: true
          description: >-
            "/api/users/{userId}/avatar?v=<key>" when the user has a photo,
            else null. The v parameter is the cache-busting version — a new
            upload is a new key.
        email:
          type: string
        version:
          type: string
          description: >-
            The server's build version — the same string the container
            image is tagged with ("0.8.0", "0.9.0-pr.42.abc1234"), or "dev"
            for an unstamped build. Shown in the Settings footer.
        role:
          type: string
          nullable: true
          description: Ours, system-admin role. "admin" or null.
        familyId:
          type: string
          nullable: true
        memberRole:
          type: string
          nullable: true
        plan:
          type: string
          nullable: true
        impersonatedBy:
          type: string
          nullable: true
    FeedLog:
      type: object
      required:
        - id
        - babyId
        - caretakerId
        - caretakerName
        - notes
        - time
        - type
        - amountMl
        - side
        - durationMin
        - leftMin
        - rightMin
        - contents
        - food
        - reaction
      properties:
        id:
          type: string
        babyId:
          type: string
        caretakerId:
          type: string
        caretakerName:
          type: string
        notes:
          type: string
          nullable: true
        time:
          type: string
          format: date-time
        type:
          type: string
          enum: [bottle, breast, solids]
        amountMl:
          type: integer
          format: int32
          nullable: true
        side:
          type: string
          enum: [left, right, both]
          nullable: true
        durationMin:
          type: integer
          format: int32
          nullable: true
        leftMin:
          type: integer
          format: int32
          nullable: true
        rightMin:
          type: integer
          format: int32
          nullable: true
        contents:
          type: string
          enum: [formula, breast_milk, mixed]
          nullable: true
          description: >-
            What a bottle held. Only meaningful for `type: bottle`; null =
            not recorded.
        food:
          type: string
          nullable: true
          description: >-
            What a solids feed was, free text ("Banana"). Only meaningful
            for `type: solids`; null = not recorded.
        reaction:
          type: boolean
          nullable: true
          description: >-
            Whether a solids feed produced a reaction (details go in
            `notes`). null = not recorded, which is not the same as false.
    CreateFeed:
      type: object
      required: [babyId, time, type]
      properties:
        babyId:
          type: string
        time:
          type: string
          format: date-time
        type:
          type: string
          enum: [bottle, breast, solids]
        amountMl:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000
        side:
          type: string
          enum: [left, right, both]
        durationMin:
          type: integer
          format: int32
          minimum: 0
          maximum: 600
        leftMin:
          type: integer
          format: int32
          minimum: 0
          maximum: 600
          nullable: true
        rightMin:
          type: integer
          format: int32
          minimum: 0
          maximum: 600
          nullable: true
        contents:
          type: string
          enum: [formula, breast_milk, mixed]
        food:
          type: string
          maxLength: 100
        reaction:
          type: boolean
        notes:
          type: string
          maxLength: 1000
    UpdateFeed:
      type: object
      description: >-
        Every field is optional; an empty object is a no-op. `amountMl`,
        `side`, `durationMin`, `leftMin`, `rightMin` and `notes` may also be
        sent as `null` to CLEAR that column; `time`/`type` are not nullable
        — only settable or omitted (see internal/api/feeds.go for the
        omitted-vs-null presence-detection pattern this endpoint needs,
        which the generated request type alone cannot provide).
      properties:
        time:
          type: string
          format: date-time
        type:
          type: string
          enum: [bottle, breast, solids]
        amountMl:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000
          nullable: true
        side:
          type: string
          enum: [left, right, both]
          nullable: true
        durationMin:
          type: integer
          format: int32
          minimum: 0
          maximum: 600
          nullable: true
        leftMin:
          type: integer
          format: int32
          minimum: 0
          maximum: 600
          nullable: true
        rightMin:
          type: integer
          format: int32
          minimum: 0
          maximum: 600
          nullable: true
        contents:
          type: string
          enum: [formula, breast_milk, mixed]
          nullable: true
        food:
          type: string
          maxLength: 100
          nullable: true
        reaction:
          type: boolean
          nullable: true
        notes:
          type: string
          maxLength: 1000
          nullable: true
    FeedTimer:
      type: object
      description: >-
        A running nursing or pump timer, shared by the whole family (issue
        #44). Elapsed time is computed by the reader: the banked
        `leftSec`/`rightSec` plus, while `runningSide` is set, now minus
        `sideStartedAt`. The server banks the running stretch on its own
        clock at every switch, pause and stop.
      required:
        - id
        - babyId
        - caretakerId
        - caretakerName
        - kind
        - startTime
        - runningSide
        - sideStartedAt
        - leftSec
        - rightSec
      properties:
        id:
          type: string
        babyId:
          type: string
        caretakerId:
          type: string
        caretakerName:
          type: string
        kind:
          type: string
          enum: [breast, pump]
        startTime:
          type: string
          format: date-time
        runningSide:
          type: string
          enum: [left, right, both]
          nullable: true
          description: >-
            The side counting now; null = paused. A pump timer is never
            paused and keeps the side chosen at start (usually `both`).
        sideStartedAt:
          type: string
          format: date-time
          nullable: true
        leftSec:
          type: integer
          format: int32
        rightSec:
          type: integer
          format: int32
          description: For a pump timer everything banks into leftSec.
    FeedTimers:
      type: object
      required: [breast, pump]
      properties:
        breast:
          allOf:
            - $ref: "#/components/schemas/FeedTimer"
          nullable: true
        pump:
          allOf:
            - $ref: "#/components/schemas/FeedTimer"
          nullable: true
    StartFeedTimer:
      type: object
      required: [babyId, kind]
      properties:
        babyId:
          type: string
        kind:
          type: string
          enum: [breast, pump]
        side:
          type: string
          enum: [left, right, both]
          description: Defaults to left for nursing, both for pumping.
        startTime:
          type: string
          format: date-time
          description: >-
            When the parent tapped Start. Defaults to now on the server;
            an offline client sends its own so a replayed start keeps the
            real moment.
    SetFeedTimerSide:
      type: object
      required: [side]
      properties:
        side:
          type: string
          enum: [left, right, both]
          nullable: true
          description: null pauses a nursing timer.
    StopFeedTimer:
      type: object
      description: >-
        Every field optional. Minutes override what the clock banked (the
        sheet's steppers); `time` overrides the logged feed's time
        (defaults to the timer's start); `amountMl` is for a pump.
      properties:
        time:
          type: string
          format: date-time
        leftMin:
          type: integer
          format: int32
          minimum: 0
          maximum: 600
        rightMin:
          type: integer
          format: int32
          minimum: 0
          maximum: 600
        amountMl:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000
        side:
          type: string
          enum: [left, right, both]
          description: >-
            Pump only: which side was pumped, when the sheet changes it
            from what the timer was started with. A nursing feed's side is
            derived from its minutes.
        durationMin:
          type: integer
          format: int32
          minimum: 0
          maximum: 600
          description: Pump only; a nursing feed's duration is its minutes.
        notes:
          type: string
          maxLength: 1000
    FeedTimerStopped:
      type: object
      description: The row the timer became; exactly one of feed / pump is set.
      required: [kind, feed, pump]
      properties:
        kind:
          type: string
          enum: [breast, pump]
        feed:
          allOf:
            - $ref: "#/components/schemas/FeedLog"
          nullable: true
        pump:
          allOf:
            - $ref: "#/components/schemas/PumpLog"
          nullable: true
    DiaperLog:
      type: object
      required:
        - id
        - babyId
        - caretakerId
        - caretakerName
        - notes
        - time
        - type
        - color
        - consistency
      properties:
        id:
          type: string
        babyId:
          type: string
        caretakerId:
          type: string
        caretakerName:
          type: string
        notes:
          type: string
          nullable: true
        time:
          type: string
          format: date-time
        type:
          type: string
          enum: [wet, dirty, both, dry]
          description: >-
            `dry` is a checked-and-clean diaper; it is counted separately so
            a dry check never inflates the wet count.
        color:
          type: string
          enum: [yellow, green, brown, black, red, other]
          nullable: true
          description: Stool colour. Only meaningful for dirty/both.
        consistency:
          type: string
          enum: [normal, loose, firm]
          nullable: true
          description: Stool consistency. Only meaningful for dirty/both.
    CreateDiaper:
      type: object
      required: [babyId, time, type]
      properties:
        babyId:
          type: string
        time:
          type: string
          format: date-time
        type:
          type: string
          enum: [wet, dirty, both, dry]
        color:
          type: string
          enum: [yellow, green, brown, black, red, other]
        consistency:
          type: string
          enum: [normal, loose, firm]
        notes:
          type: string
          maxLength: 1000
    UpdateDiaper:
      type: object
      description: >-
        Every field is optional; an empty object is a no-op. `color`,
        `consistency` and `notes` may also be sent as `null` to CLEAR them;
        `time`/`type` are not nullable — only settable or omitted (see
        internal/api/feeds.go for the presence-detection pattern this
        endpoint shares with UpdateFeed).
      properties:
        time:
          type: string
          format: date-time
        type:
          type: string
          enum: [wet, dirty, both, dry]
        color:
          type: string
          enum: [yellow, green, brown, black, red, other]
          nullable: true
        consistency:
          type: string
          enum: [normal, loose, firm]
          nullable: true
        notes:
          type: string
          maxLength: 1000
          nullable: true
    SleepLog:
      type: object
      required:
        - id
        - babyId
        - caretakerId
        - caretakerName
        - notes
        - startTime
        - endTime
        - location
        - type
      properties:
        id:
          type: string
        babyId:
          type: string
        caretakerId:
          type: string
        caretakerName:
          type: string
        notes:
          type: string
          nullable: true
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
          nullable: true
          description: null while the session is active.
        location:
          type: string
          nullable: true
        type:
          type: string
          enum: [nap, night]
          nullable: true
          description: >-
            Nap or night sleep. The client defaults it from the device's
            night-mode schedule; the server never guesses (it has no
            timezone), so an omitted type stays null. (Named `type` like
            the feed and diaper enums; `kind` is the timeline's
            discriminator and must stay free.)
    CreateSleep:
      type: object
      required: [babyId, startTime]
      properties:
        babyId:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
          description: Omit to start an active sleep session.
        location:
          type: string
          maxLength: 100
        type:
          type: string
          enum: [nap, night]
        notes:
          type: string
          maxLength: 1000
    UpdateSleep:
      type: object
      description: >-
        Every field is optional; an empty object is a no-op. `endTime`,
        `location` and `notes` may also be sent as `null` to CLEAR that
        column — clearing `endTime` reopens the session and can 409 if
        another session for the same baby is already active (see
        internal/api/sleep.go). `startTime` is not nullable — only settable
        or omitted.
      properties:
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
          nullable: true
        location:
          type: string
          maxLength: 100
          nullable: true
        type:
          type: string
          enum: [nap, night]
          nullable: true
        notes:
          type: string
          maxLength: 1000
          nullable: true
    Wake:
      type: object
      description: Defaults endTime to now on the server when omitted.
      properties:
        endTime:
          type: string
          format: date-time
    SleepLocation:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    CreateSleepLocation:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
    PlayLog:
      type: object
      description: >-
        Timed activities (tummy time, walks, free play) — same session shape
        as SleepLog: startTime + nullable endTime, null meaning "still
        running". Free (no plan gate).
      required:
        - id
        - babyId
        - caretakerId
        - caretakerName
        - notes
        - type
        - startTime
        - endTime
      properties:
        id:
          type: string
        babyId:
          type: string
        caretakerId:
          type: string
        caretakerName:
          type: string
        notes:
          type: string
          nullable: true
        type:
          type: string
          enum: [tummy, walk, play]
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
          nullable: true
          description: null while the activity is running.
    CreatePlay:
      type: object
      required: [babyId, type, startTime]
      properties:
        babyId:
          type: string
        type:
          type: string
          enum: [tummy, walk, play]
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
          nullable: true
          description: Omit to start a running session.
        notes:
          type: string
          maxLength: 2000
    UpdatePlay:
      type: object
      description: >-
        Every field is optional; an empty object is a no-op. `endTime` and
        `notes` may also be sent as `null` to CLEAR that column — clearing
        `endTime` reopens the session and can 409 if another session for
        the same baby is already running (see internal/api/play.go).
        `type`/`startTime` are not nullable — only settable or omitted.
      properties:
        type:
          type: string
          enum: [tummy, walk, play]
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          maxLength: 2000
          nullable: true
    StopPlay:
      type: object
      description: Defaults endTime to now on the server when omitted.
      properties:
        endTime:
          type: string
          format: date-time
    VaccineDocument:
      type: object
      description: >-
        One file attached to a vaccine log. Fetch through
        `/api/files/{id}` — the object store is never public.
      required: [id, filename, contentType, size, url]
      properties:
        id:
          type: string
        filename:
          type: string
        contentType:
          type: string
        size:
          type: integer
        url:
          type: string
    VaccineLog:
      type: object
      description: >-
        What was given, and when. Free — never plan-gated (only attaching
        a document is; see internal/api/files.go).
      required:
        - id
        - babyId
        - caretakerId
        - caretakerName
        - notes
        - time
        - name
        - doseNumber
        - scheduleSlot
        - documents
      properties:
        id:
          type: string
        babyId:
          type: string
        caretakerId:
          type: string
        caretakerName:
          type: string
        notes:
          type: string
          nullable: true
        time:
          type: string
          format: date-time
        name:
          type: string
