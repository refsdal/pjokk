          type: integer
          format: int32
          minimum: 0
          maximum: 1000
          nullable: true
        durationMin:
          type: integer
          format: int32
          minimum: 0
          maximum: 600
          nullable: true
        notes:
          type: string
          maxLength: 1000
          nullable: true
    CalendarEvent:
      type: object
      description: >-
        A family-wide (or baby-specific) planned event. Free (no plan
        gate — creation was premium in the TS predecessor; this port
        removes that gate).
      required:
        - id
        - title
        - description
        - location
        - category
        - startTime
        - allDay
        - durationMin
        - remindMinutesBefore
        - createdBy
        - createdByName
        - babies
        - assignees
        - recurrence
        - recurrenceUntil
        - seriesStart
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        category:
          type: string
          enum: [doctor, vaccination, babysitting, family, other]
        startTime:
          type: string
          format: date-time
          description: >-
            This occurrence's start. A series is returned once per
            occurrence in the window, all sharing the id (issue #52).
        recurrence:
          type: string
          enum: [none, daily, weekly, biweekly, monthly, yearly]
          description: >-
            Steps on the local calendar (Europe/Oslo), so a daily 08:00
            stays 08:00 across DST; monthly/yearly clamp the day.
        recurrenceUntil:
          type: string
          format: date-time
          nullable: true
          description: Last allowed occurrence start (inclusive); null = forever.
        seriesStart:
          type: string
          format: date-time
          description: The stored start of the series (equals startTime for a one-off).
        allDay:
          type: boolean
        durationMin:
          type: integer
          format: int32
          nullable: true
        remindMinutesBefore:
          type: integer
          format: int32
          nullable: true
        createdBy:
          type: string
        createdByName:
          type: string
        babies:
          type: array
          description: Zero babies = family-wide event.
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
              name:
                type: string
        assignees:
          type: array
          items:
            type: object
            required: [userId, name]
            properties:
              userId:
                type: string
              name:
                type: string
    CreateCalendarEvent:
      type: object
      required: [title, startTime]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        location:
          type: string
          maxLength: 200
        category:
          type: string
          enum: [doctor, vaccination, babysitting, family, other]
          default: other
        startTime:
          type: string
          format: date-time
        allDay:
          type: boolean
          default: false
          description: All-day events are single-day; the server nulls durationMin when set.
        durationMin:
          type: integer
          format: int32
          minimum: 5
          maximum: 1440
        remindMinutesBefore:
          type: integer
          format: int32
          minimum: 15
          maximum: 10080
        babyIds:
          type: array
          maxItems: 10
          default: []
          items:
            type: string
        assigneeUserIds:
          type: array
          maxItems: 20
          default: []
          items:
            type: string
        recurrence:
          type: string
          enum: [none, daily, weekly, biweekly, monthly, yearly]
          description: Omitted means none.
        recurrenceUntil:
          type: string
          format: date-time
          description: Inclusive on the occurrence start; ignored when recurrence is none.
    UpdateCalendarEvent:
      type: object
      description: >-
        Every field is optional; an empty object is a no-op.
        `description`/`location`/`durationMin`/`remindMinutesBefore` may
        also be sent as `null` to CLEAR that column; `title`/`category`/
        `startTime`/`allDay` are not nullable — only settable or omitted.
        `babyIds`/`assigneeUserIds`, when present, REPLACE the link set;
        omitted leaves it untouched (see internal/api/calendar.go).
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
          nullable: true
        location:
          type: string
          maxLength: 200
          nullable: true
        category:
          type: string
          enum: [doctor, vaccination, babysitting, family, other]
        startTime:
          type: string
          format: date-time
        allDay:
          type: boolean
        durationMin:
          type: integer
          format: int32
          minimum: 5
          maximum: 1440
          nullable: true
        remindMinutesBefore:
          type: integer
          format: int32
          minimum: 15
          maximum: 10080
          nullable: true
        babyIds:
          type: array
          maxItems: 10
          items:
            type: string
        assigneeUserIds:
          type: array
          maxItems: 20
          items:
            type: string
        recurrence:
          type: string
          enum: [none, daily, weekly, biweekly, monthly, yearly]
        recurrenceUntil:
          type: string
          format: date-time
          nullable: true
    Contact:
      type: object
      description: >-
        One entry in the family's address book. Zero linked babies means
        the contact belongs to the whole family. Free (no plan gate — see
        internal/api/contacts.go).
      required:
        - id
        - name
        - role
        - icon
        - phone
        - email
        - website
        - notes
        - babies
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
          nullable: true
        icon:
          type: string
          enum:
            [
              user,
              doctor,
              nurse,
              hospital,
              dental,
              family,
              grandparent,
              daycare,
              friend,
              phone,
            ]
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        babies:
          type: array
          description: Zero babies = a contact the whole family shares.
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
              name:
                type: string
    CreateContact:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        role:
          type: string
          maxLength: 60
        icon:
          type: string
          enum:
            [
              user,
              doctor,
              nurse,
              hospital,
              dental,
              family,
              grandparent,
              daycare,
              friend,
              phone,
            ]
        phone:
          type: string
          maxLength: 40
        email:
          type: string
          format: email
          maxLength: 200
        website:
          type: string
          maxLength: 200
          description: >-
            Free text, deliberately not validated as a URL — people type
            "legesenteret.no" and saving matters more than being right
            about URL shape.
        notes:
          type: string
          maxLength: 2000
        babyIds:
          type: array
          maxItems: 10
          default: []
          items:
            type: string
    UpdateContact:
      type: object
      description: >-
        Every field is optional; an empty object is a no-op.
        `role`/`icon`/`phone`/`email`/`website`/`notes` may also be sent as
        `null` to CLEAR that column; `name` is not nullable — only settable
        or omitted. `babyIds`, when present, REPLACES the link set; omitted
        leaves it untouched.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        role:
          type: string
          maxLength: 60
          nullable: true
        icon:
          type: string
          enum:
            [
              user,
              doctor,
              nurse,
              hospital,
              dental,
              family,
              grandparent,
              daycare,
              friend,
              phone,
            ]
          nullable: true
        phone:
          type: string
          maxLength: 40
          nullable: true
        email:
          type: string
          format: email
          maxLength: 200
          nullable: true
        website:
          type: string
          maxLength: 200
          nullable: true
        notes:
          type: string
          maxLength: 2000
          nullable: true
        babyIds:
          type: array
          maxItems: 10
          items:
            type: string
    PushConfig:
      type: object
      required: [publicKey]
      properties:
        publicKey:
          type: string
    Subscribe:
      type: object
      required: [endpoint, p256dh, auth]
      properties:
        endpoint:
          type: string
          format: uri
          maxLength: 1000
        p256dh:
          type: string
          minLength: 1
          maxLength: 300
        auth:
          type: string
          minLength: 1
          maxLength: 100
    Unsubscribe:
      type: object
      required: [endpoint]
      properties:
        endpoint:
          type: string
          maxLength: 1000
    Reminder:
      type: object
      required:
        - id
        - babyId
        - kind
        - mode
        - intervalMin
        - atMinute
        - days
        - tz
        - quietStart
        - quietEnd
        - label
        - lastFiredAt
      properties:
        id:
          type: string
        babyId:
          type: string
          nullable: true
          description: null = any baby in the family.
        kind:
          type: string
          enum: [feed, diaper, pump, medicine, custom]
        mode:
          type: string
          enum: [since_last, at_time]
        intervalMin:
          type: integer
          format: int32
          nullable: true
          description: since_last only.
        atMinute:
          type: integer
          format: int32
          nullable: true
          description: at_time only; minutes after local midnight in `tz`.
        days:
          type: integer
          format: int32
          description: Bit mask, bit 0 = Monday … bit 6 = Sunday; 127 = every day.
        tz:
          type: string
          description: IANA zone name the local clock is read in.
        quietStart:
          type: integer
          format: int32
          nullable: true
          description: Local hour (0–23) quiet hours begin, or null.
        quietEnd:
          type: integer
          format: int32
          nullable: true
        label:
          type: string
          nullable: true
          description: The medicine name a medicine reminder keys on, or a custom reminder's text.
        lastFiredAt:
          type: string
          format: date-time
          nullable: true
    CreateReminder:
      type: object
      required: [kind, mode, tz]
      properties:
        babyId:
          type: string
        kind:
          type: string
          enum: [feed, diaper, pump, medicine, custom]
        mode:
          type: string
          enum: [since_last, at_time]
        intervalMin:
          type: integer
          format: int32
          minimum: 15
          maximum: 1440
        atMinute:
          type: integer
          format: int32
          minimum: 0
          maximum: 1439
        days:
          type: integer
          format: int32
          minimum: 1
          maximum: 127
          default: 127
        tz:
          type: string
          maxLength: 64
        quietStart:
          type: integer
          format: int32
          minimum: 0
          maximum: 23
        quietEnd:
          type: integer
          format: int32
          minimum: 0
          maximum: 23
        label:
          type: string
          maxLength: 100
    PushTestResult:
      type: object
      required: [sent]
      properties:
        sent:
          type: integer
    ApiKey:
      type: object
      description: >-
        One bearer API key, key material never included (see ApiKeyCreated
        for the one response that carries it).
      required:
        - id
        - name
        - prefix
        - createdAt
        - lastUsedAt
        - revokedAt
        - expiresAt
        - readOnly
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
          description: The displayable head of the full key (`pjk_` + 8 more chars).
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        readOnly:
          type: boolean
    CreateApiKey:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        expiresInDays:
          type: integer
          format: int32
          minimum: 1
          maximum: 3650
          description: Omitted means the key never expires.
        readOnly:
          type: boolean
          default: false
    ApiKeyCreated:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: >-
                The full bearer token (`pjk_…`). Shown exactly once — this
                response is the only place it ever appears.
    Device:
      type: object
      description: >-
        A kiosk device. Pending until a tablet redeems its one-time code,
        active after. Key material (code, token, PIN) is never included.
      required:
        - id
        - name
        - status
        - createdAt
        - createdByName
        - enrolledAt
        - lastUsedAt
        - codeExpiresAt
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [pending, active]
        createdAt:
          type: string
          format: date-time
        createdByName:
          type: string
          description: Display name of the admin who added the device.
        enrolledAt:
          type: string
          format: date-time
          nullable: true
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        codeExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: When a pending device's current code stops working; null once set up.
    CreateDevice:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
    DeviceCode:
      type: object
      description: A device's one-time set-up code, returned exactly once.
      required: [device, code, expiresAt, setupUrl]
      properties:
        device:
          $ref: "#/components/schemas/Device"
        code:
          type: string
          description: 8 characters from the invite-code alphabet.
        expiresAt:
          type: string
          format: date-time
        setupUrl:
          type: string
          description: APP_URL/kiosk/setup?code=… — what the Settings QR encodes.
    EnrolDevice:
      type: object
      required: [code, pin]
      properties:
        code:
          type: string
          minLength: 8
          maxLength: 8
          description: The one-time code from Settings → Family → Devices, any case.
        pin:
          type: string
          pattern: "^[0-9]{4,6}$"
          description: 4–6 digits; asked for when leaving kiosk mode.
    DeviceSelf:
      type: object
      description: The kiosk device making the request.
      required: [id, name, familyId, familyName]
      properties:
        id:
          type: string
        name:
          type: string
        familyId:
          type: string
        familyName:
          type: string
    Unenrol:
      type: object
      required: [pin]
      properties:
        pin:
          type: string
          pattern: "^[0-9]{4,6}$"
    DeviceThreshold:
      type: object
      required: [kind, babyId, intervalMin]
      properties:
        kind:
          type: string
          enum: [feed, diaper]
        babyId:
          type: string
          nullable: true
          description: The reminder's baby, or null for every baby.
        intervalMin:
          type: integer
          format: int32
    Invite:
      type: object
      required:
        - code
        - familyId
        - role
        - expiresAt
        - maxUses
        - usedCount
        - revokedAt
        - url
      properties:
        code:
          type: string
        familyId:
          type: string
        role:
          type: string
          enum: [admin, member]
        expiresAt:
          type: string
          format: date-time
        maxUses:
          type: integer
        usedCount:
          type: integer
        revokedAt:
          type: string
          format: date-time
          nullable: true
        url:
          type: string
          description: "`{AppURL}/join/{code}`, ready to render as a QR code."
    CreateInvite:
      type: object
      description: Every field is optional; an empty (or absent) body uses every default.
      properties:
        role:
          type: string
          enum: [admin, member]
          default: member
        expiresInHours:
          type: integer
          minimum: 1
          maximum: 720
          default: 72
        maxUses:
          type: integer
          minimum: 1
          maximum: 50
          default: 5
    InviteInfo:
      type: object
      required: [valid, familyName, role, reason]
      properties:
        valid:
          type: boolean
        familyName:
          type: string
          nullable: true
        role:
          type: string
          enum: [admin, member]
          nullable: true
        reason:
          type: string
          enum: [revoked, expired, exhausted, not_found]
          nullable: true
    Redeem:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
    RedeemResult:
      type: object
      required: [familyId, familyName, role, alreadyMember]
      properties:
        familyId:
          type: string
        familyName:
          type: string
        role:
          type: string
          enum: [admin, member]
        alreadyMember:
          type: boolean

    # --- System-admin console (Task 21) ---------------------------------
    AdminStats:
      type: object
      description: >-
        Platform totals. Every count is a plain integer — the underlying
        COUNT(*) is bigint and must be cast (`::int`) in SQL, or the driver
        hands it back as a string (CLAUDE.md's Postgres notes).
      required:
        [families, users, babies, coreLogs, pushSubscriptions, usersLast7d]
      properties:
        families:
          type: integer
        users:
          type: integer
          description: >-
            Every row in `users`, the "Deleted user" tombstone included —
            the TypeScript predecessor counted it the same way once it had
            been created.
        babies:
          type: integer
        coreLogs:
          type: integer
          description: Feeds + diapers + sleeps.
        pushSubscriptions:
          type: integer
        usersLast7d:
          type: integer
    AdminFamily:
      type: object
      required:
        [id, name, slug, plan, createdAt, members, babies, lastFeedAt, hasAdmin]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        plan:
          type: string
        createdAt:
          type: string
          format: date-time
        members:
          type: integer
        babies:
          type: integer
        lastFeedAt:
          type: string
          format: date-time
          nullable: true
        hasAdmin:
          type: boolean
          description: >-
            Whether anyone in the family still holds the admin (or owner)
            role. False means the family is stranded — deleting an account
            cascades its membership away without consulting the last-admin
            guard — and the console badges it so an operator can promote
            someone.
    AdminFamilyMember:
      type: object
      required: [memberId, userId, name, email, role, joinedAt, banned]
      properties:
        memberId:
          type: string
          description: The family-membership row id (NOT the user id).
        userId:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
        joinedAt:
          type: string
          format: date-time
        banned:
          type: boolean
    AdminFamilyDetail:
      type: object
      description: >-
        Metadata only, by design — no log content and no per-type counts.
        See getAdminFamily's summary.
      required:
        [
          id,
          name,
          slug,
          plan,
          createdAt,
          lastFeedAt,
          members,
          babies,
          invites,
          apiKeys,
        ]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        plan:
          type: string
        createdAt:
          type: string
          format: date-time
        lastFeedAt:
          type: string
          format: date-time
          nullable: true
        members:
          type: array
          items:
            $ref: "#/components/schemas/AdminFamilyMember"
        babies:
          type: array
          items:
            $ref: "#/components/schemas/Baby"
        invites:
          type: array
          items:
            $ref: "#/components/schemas/Invite"
        apiKeys:
          type: array
          items:
            $ref: "#/components/schemas/ApiKey"
    CreateAdminFamily:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        adminEmail:
          type: string
          format: email
          maxLength: 254
          description: >-
            The account to install as the family's first admin. Omit it to
            get an empty family plus an admin-role invite instead.
        adminName:
          type: string
          minLength: 1
          maxLength: 100
          description: Required when createAccount is true; ignored otherwise.
        createAccount:
          type: boolean
          default: false
          description: >-
            Provision a passwordless account for adminEmail when none
            exists. An explicit flag rather than implicit behaviour so a
            mistyped address is refused instead of silently creating a user.
    AdminFamilyCreated:
      type: object
      required: [id, name, slug, firstAdmin, invite]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        firstAdmin:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AdminFamilyFirstAdmin"
        invite:
          description: >-
            Present only when the family was created without a first admin:
            the admin-role invite to hand to whoever will run it.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Invite"
    AdminFamilyFirstAdmin:
      type: object
      required: [userId, email, accountCreated]
      properties:
        userId:
          type: string
        email:
          type: string
        accountCreated:
          type: boolean
          description: >-
            True when this call provisioned the account (passwordless — the
            person claims it by signing in with Google on the same address).
    UpdateAdminFamily:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    AddAdminFamilyMember:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        role:
          type: string
          enum: [admin, member]
    AdminUser:
      type: object
      required: [id, name, email, role, banned, banReason, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          nullable: true
          description: Ours, system-admin role. "admin" or null.
        banned:
          type: boolean
        banReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    BanUser:
      type: object
      description: Every field is optional; an absent body bans with no stated reason.
      properties:
        reason:
          type: string
          maxLength: 500
    SetUserPassword:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 8
          maxLength: 128
    AuditEntry:
      type: object
      required: [id, adminId, adminName, action, target, detail, createdAt]
      properties:
        id:
          type: string
        adminId:
          type: string
        adminName:
          type: string
        action:
          type: string
        target:
          type: string
        detail:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    AuditPage:
      type: object
      description: One page of admin actions, newest first.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        nextCursor:
          type: string
          nullable: true
          description: Pass as `cursor` for the next page; null on the last one.
    AdminUserPage:
      type: object
      description: One page of accounts, newest first.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        nextCursor:
          type: string
          nullable: true
          description: Pass as `cursor` for the next page; null on the last one.
    AdminFamilyPage:
      type: object
      description: One page of families, newest first.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminFamily"
        nextCursor:
          type: string
          nullable: true
          description: Pass as `cursor` for the next page; null on the last one.
    AdminUserDetail:
      type: object
      description: >-
        One person for the console's user page. Metadata only: no log
        content, no token, no address.
      required: [id, name, email, role, banned, banReason, createdAt, hasPassword, families, providers, sessions]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          nullable: true
          description: Ours, system-admin role. "admin" or null.
        banned:
          type: boolean
        banReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        hasPassword:
          type: boolean
        families:
          type: array
          items:
            $ref: "#/components/schemas/AdminUserFamily"
        providers:
          type: array
          items:
            $ref: "#/components/schemas/AdminUserProvider"
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/AdminSession"
    AdminUserFamily:
      type: object
      required: [familyId, name, role]
      properties:
        familyId:
          type: string
        name:
          type: string
        role:
          type: string
    AdminUserProvider:
      type: object
      required: [provider, linkedAt]
      properties:
        provider:
          type: string
          description: The OAuth provider, e.g. "google".
        linkedAt:
          type: string
          format: date-time
    AdminSession:
      type: object
      required: [id, userAgent, createdAt, lastActiveAt, expiresAt, familyName, impersonatedByName]
      properties:
        id:
          type: string
        userAgent:
          type: string
          nullable: true
          description: The browser's own description; the console turns it into "Chrome on Android".
        createdAt:
          type: string
          format: date-time
        lastActiveAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        familyName:
          type: string
          nullable: true
        impersonatedByName:
          type: string
          nullable: true
          description: The operator driving this session, when one is.
    AdminEmailChange:
      type: object
      required: [email]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
    AuditNote:
      type: object
      required: [action, target]
      properties:
        action:
          type: string
          minLength: 1
          maxLength: 60
        target:
          type: string
          minLength: 1
          maxLength: 200
        detail:
          type: string
          maxLength: 500
    Error:
      type: object
      description: >-
        The error envelope used by every non-2xx JSON response in the API
        (CLAUDE.md: "{error: string, code: string}" everywhere).
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
        issues:
          type: array
          description: >-
            Optional per-field validation issues. The frontend only reads
            error/code today; issues exist for future, more specific UI.
          items:
            type: object
            required: [path, message]
            properties:
              path:
                type: string
              message:
                type: string
