openapi: 3.0.3
info:
  title: Pjokk API
  description: >-
    Pjokk is a self-hosted baby tracker for families. This spec is the single
    source of truth for the Go server's HTTP surface: it drives runtime
    request validation (kin-openapi nethttp-middleware), the generated
    strict-server routes and types (oapi-codegen), and the interactive docs
    served at /api/docs (Scalar, reading /api/openapi.json — this file,
    converted to JSON at runtime).
  version: "1.0.0"
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: healthz
      summary: Liveness probe. Touches nothing — not even the database pool.
      tags: [system]
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
  /readyz:
    get:
      operationId: readyz
      summary: Readiness probe. Runs `SELECT 1` against the database pool.
      tags: [system]
      responses:
        "200":
          description: The process is ready to serve traffic.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
        "503":
          description: The database is unreachable.
          content:
            application/json:
              schema:
                type: object
                required: [ok, error]
                properties:
                  ok:
                    type: boolean
                    enum: [false]
                  error:
                    type: string

  /api/config:
    get:
      operationId: getConfig
      summary: >-
        Public client configuration: which account-creation paths the
        /login and /join screens should offer. No session required, and no
        secrets in the response — just two booleans-worth of config the
        client could otherwise only infer indirectly (e.g. by trying a
        credential signup and reading the 403).
      tags: [config]
      responses:
        "200":
          description: Which account-creation paths the client should offer.
          content:
            application/json:
              schema:
                type: object
                required: [openSignup, oauthProviders]
                properties:
                  openSignup:
                    type: boolean
                  oauthProviders:
                    type: array
                    items:
                      type: string

  /api/babies:
    get:
      operationId: listBabies
      summary: Babies in the caller's active family, oldest first.
      tags: [babies]
      responses:
        "200":
          description: Babies in the active family.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Baby"
    post:
      operationId: createBaby
      summary: Create a baby in the caller's active family. Free — no plan gate.
      tags: [babies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBaby"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Baby"
  /api/babies/{id}:
    patch:
      operationId: updateBaby
      summary: >-
        Partial update. An empty body is a no-op that returns the baby
        unchanged.
      tags: [babies]
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBaby"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Baby"
        "404":
          description: No baby with this id in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteBaby
      summary: >-
        Family-admin only. Deletes the baby and EVERY log for them
        (cascade).
      tags: [babies]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "403":
          description: Family admin only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No baby with this id in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/family:
    get:
      operationId: getFamily
      summary: The caller's active family.
      tags: [family]
      responses:
        "200":
          description: The active family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"
        "404":
          description: Family missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/family/members:
    get:
      operationId: listFamilyMembers
      summary: Caretakers in the caller's active family.
      tags: [family]
      responses:
        "200":
          description: Caretakers in the family.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
  /api/family/members/{memberId}:
    delete:
      operationId: deleteFamilyMember
      summary: Remove a member from the caller's active family. Family-admin only.
      tags: [family]
      parameters:
        - $ref: "#/components/parameters/memberIdPath"
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          description: Cannot remove the last admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Family admin only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such member in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/family/members/{memberId}/role:
    post:
      operationId: setFamilyMemberRole
      summary: Change a member's role in the caller's active family. Family-admin only.
      tags: [family]
      parameters:
        - $ref: "#/components/parameters/memberIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMemberRole"
      responses:
        "200":
          description: Role changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          description: Cannot demote the last admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Family admin only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such member in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/feeds:
    get:
      operationId: listFeeds
      summary: Feed logs in the caller's active family, newest first.
      tags: [feeds]
      parameters:
        - $ref: "#/components/parameters/babyIdQuery"
        - $ref: "#/components/parameters/limitQuery"
      responses:
        "200":
          description: Feed logs, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedLog"
    post:
      operationId: createFeed
      summary: Log a feed for a baby in the caller's active family.
      tags: [feeds]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFeed"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedLog"
        "404":
          description: Unknown baby.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/feeds/{id}:
    patch:
      operationId: updateFeed
      summary: >-
        Partial update. A field sent as `null` clears the column; an
        omitted field is left unchanged; an empty body is a no-op that
        returns the feed unchanged. `time`/`type` are not nullable — only
        settable or omitted. See internal/api/feeds.go for how this
        endpoint tells "omitted" apart from "null" (the generated request
        type alone cannot).
      tags: [feeds]
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFeed"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedLog"
        "404":
          description: No feed with this id in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteFeed
      summary: Delete a feed log.
      tags: [feeds]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "404":
          description: No feed with this id in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/feeds/timer:
    get:
      operationId: getFeedTimer
      summary: >-
        The running nursing and pump timers for a baby, either null. One
        call for both because Home Assistant and the SPA both want the
        pair; /api/summary carries the same two objects as activeFeed /
        activePump.
      tags: [feeds]
      parameters:
        - name: babyId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Both timers, each null when not running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedTimers"
        "404":
          description: Unknown baby.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: startFeedTimer
      summary: >-
        Start a nursing or pump timer for a baby. One running timer per
        (baby, kind) — enforced by a unique index, not just the pre-check —
        so a second start for the same kind is 409 while a pump timer next
        to a running nursing timer is fine. `startTime` lets an offline
        client replay the moment it actually tapped Start.
      tags: [feeds]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartFeedTimer"
      responses:
        "201":
          description: Started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedTimer"
        "404":
          description: Unknown baby.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A timer of this kind is already running for the baby.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/feeds/timer/{id}/side:
    post:
      operationId: setFeedTimerSide
      summary: >-
        Switch the running side of a nursing timer, or pause it with `side:
        null`. The stretch that was running is banked on the server's clock
        first. A pump timer is one clock and cannot be paused (400).
      tags: [feeds]
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetFeedTimerSide"
      responses:
        "200":
          description: The timer after the switch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedTimer"
        "400":
          description: Pausing a pump timer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such running timer in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/feeds/timer/{id}/stop:
    post:
      operationId: stopFeedTimer
      summary: >-
        Stop a timer and log it: a nursing timer becomes a breast FeedLog
        (time = the timer's start, per-side minutes from the banked
        seconds, 20 s still counts as 1 min), a pump timer becomes a
        PumpLog. Both happen in one transaction with the timer's deletion,
        so a replayed stop is a 404 rather than a second row. The sheet's
        steppers may override the clock through the body.
      tags: [feeds]
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StopFeedTimer"
      responses:
        "201":
          description: Logged; the timer is gone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedTimerStopped"
        "404":
          description: No such running timer in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/feeds/timer/{id}:
    delete:
      operationId: discardFeedTimer
      summary: Throw a running timer away without logging anything.
      tags: [feeds]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: Discarded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "404":
          description: No such running timer in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/diapers:
    get:
      operationId: listDiapers
      summary: Diaper logs in the caller's active family, newest first.
      tags: [diapers]
      parameters:
        - $ref: "#/components/parameters/babyIdQuery"
        - $ref: "#/components/parameters/limitQuery"
      responses:
        "200":
          description: Diaper logs, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiaperLog"
    post:
      operationId: createDiaper
      summary: Log a diaper change for a baby in the caller's active family.
      tags: [diapers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDiaper"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiaperLog"
        "404":
          description: Unknown baby.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/diapers/{id}:
    patch:
      operationId: updateDiaper
      summary: >-
        Partial update. A field sent as `null` clears the column; an
        omitted field is left unchanged; an empty body is a no-op that
        returns the diaper log unchanged. `time`/`type` are not nullable —
        only settable or omitted. See internal/api/feeds.go for how this
        endpoint tells "omitted" apart from "null" (the generated request
        type alone cannot).
      tags: [diapers]
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDiaper"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiaperLog"
        "404":
          description: No diaper log with this id in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteDiaper
      summary: Delete a diaper log.
      tags: [diapers]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "404":
          description: No diaper log with this id in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/sleep:
    get:
      operationId: listSleeps
      summary: Sleep logs in the caller's active family, newest first (by startTime).
      tags: [sleep]
      parameters:
        - $ref: "#/components/parameters/babyIdQuery"
        - $ref: "#/components/parameters/limitQuery"
      responses:
        "200":
          description: Sleep logs, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SleepLog"
    post:
      operationId: createSleep
      summary: >-
        Create a sleep log. Omit endTime to start an active session; a baby
        can only have one active session at a time — enforced by a partial
        unique index (see internal/api/sleep.go), not just the pre-check
        this endpoint also does.
      tags: [sleep]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSleep"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SleepLog"
        "404":
          description: Unknown baby.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Baby already has an active session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sleep/active:
    get:
      operationId: getActiveSleep
      summary: The active sleep session for a baby, or null.
      tags: [sleep]
      parameters:
        - $ref: "#/components/parameters/babyIdQuery"
      responses:
        "200":
          description: The active sleep session, or null.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SleepLog"
                nullable: true
  /api/sleep/{id}/wake:
    post:
      operationId: wakeSleep
      summary: End the active session for a sleep log. endTime defaults to now.
      tags: [sleep]
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Wake"
      responses:
        "200":
          description: Session ended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SleepLog"
        "404":
          description: No such active session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sleep/{id}:
    patch:
      operationId: updateSleep
      summary: >-
        Partial update. `endTime` sent as `null` CLEARS it, reopening the
        session — subject to the same one-active-session-per-baby
        constraint as create, so this can also 409. `location`/`notes` may
        also be sent as `null` to clear them; `startTime` is not nullable —
        only settable or omitted. See internal/api/feeds.go for the
        omitted-vs-null presence-detection pattern this endpoint needs.
      tags: [sleep]
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSleep"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SleepLog"
        "404":
          description: No sleep log with this id in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            Clearing endTime would reopen a session while another is
            already active for this baby.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteSleep
      summary: Delete a sleep log.
      tags: [sleep]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "404":
          description: No sleep log with this id in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/sleep-locations:
    get:
      operationId: listSleepLocations
      summary: Custom sleep-location chips for the caller's active family.
      tags: [sleep-locations]
      responses:
        "200":
          description: Custom sleep locations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SleepLocation"
    post:
      operationId: createSleepLocation
      summary: >-
        Family-admin only; not available to API keys. Rejects a name that
        duplicates a default chip or an existing custom one
        (case-insensitive), and caps custom locations at 20 per family.
      tags: [sleep-locations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSleepLocation"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SleepLocation"
        "400":
          description: Name is empty once whitespace is trimmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Family admin only, or an API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Duplicate name or limit reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sleep-locations/{id}:
    delete:
      operationId: deleteSleepLocation
      summary: Family-admin only; not available to API keys.
      tags: [sleep-locations]
      parameters:
        - $ref: "#/components/parameters/idPath"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "403":
          description: Family admin only, or an API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such location in the caller's family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/summary:
    get:
      operationId: getSummary
      summary: >-
        Everything the home screen needs in one call: last feed, last
        diaper, active + last sleep, active play, and today's local-day
        totals.
      tags: [summary]
      parameters:
        - name: babyId
          in: query
          required: true
          schema:
            type: string
        - name: tz
          in: query
          required: false
          description: >-
            The requester's Date.getTimezoneOffset() (minutes,
            UTC-minus-local). The `today` block follows the caretaker's
            clock, not the server's. Defaults to 0 (UTC) when omitted.
          schema:
            type: integer
            minimum: -840
            maximum: 840
            default: 0
      responses:
        "200":
          description: Status summary for a baby.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Summary"
        "404":
          description: Unknown baby.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/medicine:
    get:
      operationId: listMedicine
      summary: Medicine logs in the caller's active family, newest first.
      tags: [medicine]
      parameters:
        - $ref: "#/components/parameters/babyIdQuery"
        - $ref: "#/components/parameters/limitQuery"
      responses:
        "200":
          description: Medicine logs, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MedicineLog"
    post:
      operationId: createMedicine
      summary: Log a medicine dose for a baby in the caller's active family.
      tags: [medicine]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMedicine"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicineLog"
        "404":
          description: Unknown baby.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/medicine/{id}:
    patch:
      operationId: updateMedicine
      summary: >-
        Partial update. `amount`, `unit` and `notes` may be sent as `null`
        to CLEAR that column; `time`/`name` are not nullable — only settable
        or omitted. An empty body is a no-op. See internal/api/feeds.go for
        the omitted-vs-null presence-detection pattern this endpoint needs.
      tags: [medicine]
      parameters:
        - $ref: "#/components/parameters/idPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
