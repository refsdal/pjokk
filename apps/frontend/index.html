<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#faf9f7" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- WebKit ignores an SVG apple-touch-icon and falls back to a screenshot
         of the page, so this one must be a PNG (scripts/gen-icons.mjs). -->
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <!-- Modern iOS honours the manifest's display:standalone, but the meta is
         what older iOS reads, and it costs nothing to keep both. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pjokk" />
    <title>Pjokk</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
