<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- theme-init.js overwrites this before the first paint and
         AppearanceProvider keeps it in step afterwards; this value only
         survives if both fail. It matches the manifest's baked theme_color
         rather than the light palette, because the case where nothing runs is
         exactly the case an installed app cannot recover from: the system
         picks its status-bar glyphs from here, and a light value under a bar
         baked dark is an invisible clock (src/lib/system-chrome.ts). -->
    <meta name="theme-color" content="#171512" />
    <!-- Render-blocking on purpose: it must set the theme classes and the
         colour above BEFORE anything paints. External rather than inline
         because the app runs under script-src 'self'. -->
    <script src="/theme-init.js"></script>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- WebKit ignores an SVG apple-touch-icon and falls back to a screenshot
         of the page, so this one must be a PNG (scripts/gen-icons.mjs). -->
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <!-- Modern iOS honours the manifest's display:standalone, but the meta is
         what older iOS reads, and it costs nothing to keep both. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pjokk" />
    <title>Pjokk</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
